<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SleepTown 动效 Demo · 暗房显影 / 聚光灯 / 墨水晕开</title>
<style>
  :root{
    --st-ink:#0d1117; --st-ink2:#11161f; --st-paper:#e8e2d4; --st-paper2:#d8d0bd;
    --st-lamp:#e8a33d; --st-lamp-soft:rgba(232,163,61,.5); --st-fog:rgba(180,195,210,.55);
    --st-line:rgba(232,226,212,.18); --ease:cubic-bezier(.22,1,.36,1);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:radial-gradient(120% 120% at 50% 0%,#161c27 0%,var(--st-ink) 60%);
    color:var(--st-paper);font-family:"Courier New",ui-monospace,monospace;min-height:100vh;padding:48px 20px;
    /* 胶片颗粒层 */
    position:relative;overflow-x:hidden}
  body::after{content:"";position:fixed;inset:0;pointer-events:none;opacity:.05;z-index:9;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>")}
  h1{font-weight:400;letter-spacing:.18em;text-align:center;color:var(--st-paper);font-size:1.05rem;margin-bottom:6px}
  .sub{text-align:center;color:var(--st-line);font-size:.72rem;letter-spacing:.1em;margin-bottom:40px}
  .stage{max-width:680px;margin:0 auto 56px;position:relative}
  .label{font-size:.7rem;letter-spacing:.22em;color:var(--st-lamp);margin-bottom:14px;text-transform:uppercase}
  .hint{margin-top:14px;font-size:.68rem;color:var(--st-line);letter-spacing:.08em}

  /* ---------- 1. 暗房显影：角色卡 ---------- */
  .darkroom{position:relative;height:200px;border-radius:10px;overflow:hidden;
    background:linear-gradient(160deg,#1a212e,#0e131b);display:flex;align-items:center;justify-content:center}
  .role-card{position:relative;width:300px;padding:26px 22px;border-radius:8px;
    background:var(--st-paper);color:var(--st-ink);
    /* 显影：用 mask 横向擦除 + 柔边 */
    -webkit-mask-image:linear-gradient(90deg,transparent 0%,#000 14%,#000 86%,transparent 100%);
            mask-image:linear-gradient(90deg,transparent 0%,#000 14%,#000 86%,transparent 100%);
    -webkit-mask-size:230% 100%;mask-size:230% 100%;
    -webkit-mask-position:0% 0;mask-position:0% 0;
    transition:-webkit-mask-position 1.4s var(--ease),mask-position 1.4s var(--ease);}
  .role-card.show{-webkit-mask-position:100% 0;mask-position:100% 0}
  .role-card .fish{width:54px;height:54px;border-radius:50%;background:#c9bfa6;margin:0 auto 12px;
    display:flex;align-items:center;justify-content:center;font-size:1.5rem}
  .role-card h3{text-align:center;letter-spacing:.1em;font-size:.95rem}
  .role-card p{text-align:center;font-size:.7rem;color:#5b5340;margin-top:6px;letter-spacing:.05em}
  /* 雾层：显影前盖一层雾，淡出 */
  .fog{position:absolute;inset:0;background:radial-gradient(60% 60% at 50% 50%,var(--st-fog),transparent 70%);
    opacity:0;transition:opacity 1.2s var(--ease);pointer-events:none}
  .darkroom.play .fog{opacity:1;transition:opacity 1.6s var(--ease) .2s}

  /* ---------- 2. 聚光灯 + 打字机：放逐结果 ---------- */
  .spotlight{position:relative;height:200px;border-radius:10px;overflow:hidden;background:#070a0f;
    display:flex;align-items:center;justify-content:center}
  .beam{position:absolute;width:60%;aspect-ratio:1;left:50%;top:50%;transform:translate(-50%,-50%) scale(.2);
    background:radial-gradient(circle,var(--st-lamp-soft) 0%,transparent 62%);opacity:0;
    transition:transform 1.5s var(--ease),opacity 1.2s var(--ease)}
  .spotlight.play .beam{transform:translate(-50%,-50%) scale(1);opacity:1}
  .verdict{position:relative;font-size:1.15rem;letter-spacing:.18em;color:var(--st-paper);
    text-shadow:0 0 18px rgba(232,163,61,.35);white-space:nowrap}
  .verdict .cursor{display:inline-block;width:9px;height:1.05em;background:var(--st-lamp);
    margin-left:3px;vertical-align:-2px;opacity:0;animation:blink .7s steps(1) infinite}
  .spotlight.play .verdict .cursor{opacity:1}
  @keyframes blink{50%{opacity:0}}

  /* ---------- 3. 墨水晕开：界面转场 ---------- */
  .wipe{position:relative;height:200px;border-radius:10px;overflow:hidden;background:#0e131b}
  .wipe .panel{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    font-size:.9rem;letter-spacing:.2em}
  .wipe .a{background:linear-gradient(160deg,#22303f,#0e131b);color:var(--st-paper)}
  .wipe .b{background:linear-gradient(160deg,#2a1f14,#0e131b);color:var(--st-lamp);
    /* 墨晕：用 mask 斜擦 + 湍流扰动边缘 */
    -webkit-mask-image:linear-gradient(115deg,#000 0%,#000 45%,transparent 55%,transparent 100%);
            mask-image:linear-gradient(115deg,#000 0%,#000 45%,transparent 55%,transparent 100%);
    -webkit-mask-size:260% 100%;mask-size:260% 100%;
    -webkit-mask-position:100% 0;mask-position:100% 0;
    transition:-webkit-mask-position 1.3s var(--ease),mask-position 1.3s var(--ease);
    filter:url(#inkbleed)}
  .wipe.play .b{-webkit-mask-position:0% 0;mask-position:0% 0}

  /* 触发文字（刻意无框，仅下划线微光） */
  .replay{display:inline-block;margin-top:14px;font-size:.72rem;letter-spacing:.14em;color:var(--st-lamp);
    cursor:pointer;border:none;background:none;font-family:inherit;
    border-bottom:1px solid var(--st-line);padding:2px 0;transition:color .25s,border-color .25s}
  .replay:hover{color:#fff;border-color:var(--st-lamp)}
  @media (prefers-reduced-motion:reduce){
    .role-card,.beam,.wipe .b{transition:none!important;-webkit-mask-position:100% 0;mask-position:100% 0;opacity:1!important}
    .fog{display:none}
  }
</style>
</head>
<body>
  <h1>深 夜 渔 港 · 动 效 语 汇</h1>
  <div class="sub">DARKROOM · SPOTLIGHT · INK-BLEED — 纯 CSS/JS，无框，无外部依赖</div>

  <!-- 1 -->
  <section class="stage">
    <div class="label">① 暗房显影 · 角色揭示</div>
    <div class="darkroom" id="dr">
      <div class="role-card" id="rc">
        <div class="fish">🐟</div>
        <h3>验 尸 官</h3>
        <p>豪鱼 · 在暗房里让死者开口</p>
      </div>
      <div class="fog"></div>
    </div>
    <button class="replay" onclick="playDR()">▶ 重播显影</button>
    <div class="hint">mask 横向擦除 + 柔边 + 雾层淡出，对应开局角色卡浮现。</div>
  </section>

  <!-- 2 -->
  <section class="stage">
    <div class="label">② 聚光灯 + 打字机 · 放逐结果</div>
    <div class="spotlight" id="sl">
      <div class="beam"></div>
      <div class="verdict"><span id="vd"></span><span class="cursor"></span></div>
    </div>
    <button class="replay" onclick="playSL()">▶ 重播裁决</button>
    <div class="hint">radial 暖光（--st-lamp）照出名字 + JS 逐字敲出判定，禁弹跳。</div>
  </section>

  <!-- 3 -->
  <section class="stage">
    <div class="label">③ 墨水晕开 · 界面转场</div>
    <div class="wipe" id="wp">
      <div class="panel a">配 置 完 毕</div>
      <div class="panel b">进 入 渔 港 夜 局</div>
    </div>
    <button class="replay" onclick="playWP()">▶ 重播转场</button>
    <div class="hint">mask 斜擦 + feTurbulence 扰动边缘 = 墨在湿纸上晕开，替代硬切。</div>
  </section>

  <!-- 墨晕湍流滤镜 -->
  <svg width="0" height="0" style="position:absolute">
    <filter id="inkbleed"><feTurbulence type="fractalNoise" baseFrequency="0.012 0.04" numOctaves="2" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="14"/></filter>
  </svg>

<script>
  function playDR(){const d=document.getElementById('dr'),c=document.getElementById('rc');
    c.classList.remove('show');d.classList.remove('play');
    void d.offsetWidth;d.classList.add('play');requestAnimationFrame(()=>c.classList.add('show'));}
  function playSL(){const s=document.getElementById('sl'),v=document.getElementById('vd');
    s.classList.remove('play');v.textContent='';void s.offsetWidth;s.classList.add('play');
    const txt='被 放 逐 ： 豪 鱼';let i=0;
    const t=setInterval(()=>{v.textContent+=txt[i++];if(i>=txt.length)clearInterval(t);},120);}
  function playWP(){const w=document.getElementById('wp');
    w.classList.remove('play');void w.offsetWidth;w.classList.add('play');}
  // 自动播一遍
  window.addEventListener('load',()=>{playDR();setTimeout(playSL,400);setTimeout(playWP,800);});
</script>
</body>
</html>
