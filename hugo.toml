baseURL = "https://deepsleep.fun/"
languageCode = "zh-CN"
title = "DeepSleep Blog"
theme = ["PaperMod"]

[params]
  # 主题配置
  defaultTheme = "auto"
  themeColor = "#D4AF37"
  
  # 首页信息
  [params.homeInfoParams]
    Title = "🌙 DeepSleep Blog"
    Content = """
      <p style='font-size: 1.1em; line-height: 1.8;'>
      👋 欢迎来到我的个人博客空间<br><br>
      
      这里记录<span style='color: #D4AF37; font-weight: bold;'>技术探索</span>与<span style='color: #888; font-weight: bold;'>生活感悟</span><br><br>
      
      <em>用文字留住时光，用代码构建未来</em>
      </p>
    """

  # 社交链接
  [[params.socialIcons]]
    name = "github"
    url = "https://github.com/106-official"

  [[params.socialIcons]]
    name = "email"
    url = "mailto:your@email.com"

  # 功能开关
  ShowReadingTime = true
  ShowShareButtons = true
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true

  # 评论系统 - Waline
  comments = true

  [params.waline]
    serverURL = "https://waline-deepsleep.vercel.app"
    lang = "zh-CN"
    emoji = ["https://cdn.jsdelivr.net/npm/@waline/emojis@1.1.0/bilibili"]
    requiredMeta = ["nick", "email"]
    wordLimit = [0, 500]
    pageSize = 10
    placeholder = "欢迎发表你的看法~ 支持Markdown语法 ✨"

  # 主页布局
  [params.profileMode]
    enabled = true
    title = "DeepSleep Blog"
    subtitle = "✨ 技术 · 生活 · 思考"
    imageUrl = ""
    imageTitle = "DeepSleep"
    imageWidth = 150
    imageHeight = 150
    
    [[params.profileMode.buttons]]
      name = "📝 文章"
      url = "/posts"
    
    [[params.profileMode.buttons]]
      name = "🏷️ 标签"
      url = "/tags"
    
    [[params.profileMode.buttons]]
      name = "📦 资源"
      url = "/resources"

  # 文章列表样式
  [params.cover]
    hidden = true
    hiddenInList = true
    hiddenInSingle = true

  # 编辑器信息
  [params.editPost]
    URL = "https://github.com/106-official/deepsleep-blog/tree/main/content/posts"
    Text = "在 GitHub 上编辑此文章 ✏️"
    addPlainText = true

  # 搜索功能
  [params.fuseOpts]
    isCaseSensitive = false
    shouldSort = true
    location = 0
    distance = 1000
    threshold = 0.4
    minMatchCharLength = 0
    keys = ["title", "permalink", "summary", "content"]

# 输出格式
[outputs]
  home = ["HTML", "RSS", "JSON"]

# 导航菜单
[[menu.main]]
  identifier = "posts"
  name = "文章"
  url = "/posts/"
  weight = 10

[[menu.main]]
  identifier = "resources"
  name = "资源"
  url = "/resources/"
  weight = 20

[[menu.main]]
  identifier = "learn"
  name = "学习"
  url = "/learn/"
  weight = 25

[[menu.main]]
  identifier = "me"
  name = "我"
  url = "/me/"
  weight = 30

[[menu.main]]
  identifier = "profile"
  name = "个人"
  url = "/profile/"
  weight = 32

[[menu.main]]
  identifier = "community"
  name = "社区"
  url = "/community/"
  weight = 40

[[menu.main]]
  identifier = "play"
  name = "娱乐"
  url = "/play/"
  weight = 50

# Markdown 渲染
[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

  [markup.highlight]
    noClasses = false
    anchorLineNos = true
    codeFences = true
    guessSyntax = true
    lineNos = true
    style = "monokai"

# 相关内容
[related]
  includeNewer = true
  threshold = 80
  toLower = true
  
  [[related.indices]]
    name = "keywords"
    weight = 100
  
  [[related.indices]]
    name = "tags"
    weight = 80
  
  [[related.indices]]
    name = "date"
    weight = 10

# 社交媒体分享
[[params.socialIcons]]
  name = "twitter"
  url = "#"

# 分析工具（可选）
# [params.analytics]
#   google = "G-XXXXXXXXXX"