{{ define "main" }}
<div class="cardarena-page">
  <div class="ca-stage">
    <header class="ca-page-header">
      <h1>CardArena</h1>
      <p class="ca-page-sub">多角色轮换卡牌对战 · 选择 6 名角色出战，击败对方全部角色</p>
      <div class="ca-header-ornament" aria-hidden="true"><b></b><b></b><b></b><b></b></div>
    </header>
    <div id="cardarena-app"></div>
    <!-- 开场闪屏：金质卡牌扇阵（复用 /js/three.module.min.js，无新依赖；无 WebGL 降级纯 CSS 金徽） -->
    <div id="ca-splash">
      <canvas id="ca-splash-canvas"></canvas>
      <div class="ca-splash-fallback" id="ca-splash-fallback">
        <div class="ca-fb-medallion"></div>
        <div class="ca-fb-text">CARD·ARENA</div>
      </div>
      <div class="ca-splash-hint">移动鼠标 · 光影随你流转</div>
      <div class="ca-splash-copy">
        <div class="ca-splash-title">CardArena</div>
        <div class="ca-splash-sub">苏丹宫廷 · 多角色轮换卡牌对战</div>
        <div class="ca-splash-tag">CARD·ARENA · 卡牌对战</div>
      </div>
      <div class="ca-splash-tap" id="ca-splash-tap">点击任意处继续</div>
      <label class="ca-splash-never">
        <input type="checkbox" id="ca-splash-never" /> 不再自动播放
      </label>
    </div>
  </div>
</div>
<link rel="stylesheet" href="/css/cardarena.css">
<script src="/js/cardarena-data.js"></script>
<script src="/js/cardarena-engine.js"></script>
<script src="/js/cardarena-ai.js"></script>
<script src="/js/cardarena-ui.js"></script>
<script type="importmap">
{ "imports": { "three": "/js/three.module.min.js" } }
</script>
<script type="module" src="/js/cardarena-splash.js"></script>
<style>
  .main:has(.cardarena-page) {
    max-width: 100% !important;
    margin: 0 !important;
    padding: 0 !important;
  }
  .ca-page-header {
    max-width: 920px;
    margin: 0 auto;
    padding: 16px 16px 0;
    position: relative;
    text-align: center;
  }
  .ca-page-header h1 {
    font-family: var(--cardarena-serif, 'Noto Serif SC', 'Songti SC', 'SimSun', Georgia, serif);
    font-weight: 600;
    font-size: 1.9rem;
    margin: 0 0 6px;
    color: var(--cardarena-gold, #c9a227);
    letter-spacing: 0.14em;
    display: inline-block;
    padding-bottom: 6px;
    position: relative;
    text-shadow: 0 1px 0 rgba(255, 255, 255, 0.35);
  }
  [data-theme="dark"] .ca-page-header h1 {
    text-shadow: 0 1px 2px rgba(0, 0, 0, 0.6);
  }
  /* 标题双金线 + 中心菱形 */
  .ca-page-header h1::after {
    content: '';
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    height: 2px;
    background: linear-gradient(90deg, var(--cardarena-gold, #c9a227), var(--cardarena-gold-dark, #8a6a2f), var(--cardarena-gold, #c9a227));
  }
  .ca-page-header h1::before {
    content: '';
    position: absolute;
    left: 50%;
    bottom: -5px;
    width: 8px;
    height: 8px;
    transform: translateX(-50%) rotate(45deg);
    background: var(--cardarena-crimson, #7a1626);
    border: 1px solid var(--cardarena-gold, #c9a227);
  }
  .ca-page-sub {
    margin: 8px 0 0;
    color: var(--cardarena-muted, #7a6848);
    font-size: 0.9rem;
    letter-spacing: 0.04em;
  }
  /* 标题下装饰条带：菱形 + 珠串 */
  .ca-header-ornament {
    margin: 10px auto 0;
    height: 8px;
    width: 76%;
    position: relative;
  }
  .ca-header-ornament::before {
    content: '';
    position: absolute;
    left: 0;
    right: 0;
    top: 3px;
    height: 1px;
    background: repeating-linear-gradient(90deg, transparent 0 7px, var(--cardarena-gold, #c9a227) 7px 9px);
  }
  .ca-header-ornament::after {
    content: '';
    position: absolute;
    left: 50%;
    top: 50%;
    width: 10px;
    height: 10px;
    transform: translate(-50%, -50%) rotate(45deg);
    background: var(--cardarena-gold, #c9a227);
    opacity: 0.85;
    box-shadow: 0 0 0 2px var(--cardarena-bg, #f4ead2), 0 0 0 3px var(--cardarena-gold, #c9a227);
  }
  .ca-header-ornament b {
    position: absolute;
    top: 50%;
    width: 4px;
    height: 4px;
    border-radius: 50%;
    background: var(--cardarena-gold, #c9a227);
    transform: translateY(-50%);
    opacity: 0.9;
  }
  .ca-header-ornament b:nth-of-type(1) { left: 12%; }
  .ca-header-ornament b:nth-of-type(2) { left: 24%; }
  .ca-header-ornament b:nth-of-type(3) { right: 24%; }
  .ca-header-ornament b:nth-of-type(4) { right: 12%; }
  [data-theme="dark"] .ca-page-header h1 { color: var(--cardarena-gold-light, #eed48a); }
</style>
<style id="ca-splash-style">
  /* 开场闪屏：自包含深色暖金字面量，不重声明站点 --cardarena-*，保证电影感不被浅色主题影响 */
  #ca-splash {
    position: fixed; inset: 0; z-index: 9999; pointer-events: none;
    background:
      radial-gradient(1100px 520px at 50% 44%, rgba(212,175,55,0.14), transparent 60%),
      radial-gradient(900px 900px at 50% 62%, rgba(28,10,12,0) 40%, rgba(8,4,3,0.94) 78%),
      linear-gradient(180deg, #1c0f0c, #2a140d 60%, #0d0604);
    opacity: 0; transition: opacity 0.9s ease;
    font-family: var(--cardarena-serif, 'Noto Serif SC', Georgia, serif);
    color: #f1e3c4;
  }
  #ca-splash.show { opacity: 1; pointer-events: auto; }
  #ca-splash.gone { opacity: 0; pointer-events: none; }
  #ca-splash-canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .ca-splash-copy {
    position: absolute; left: 0; right: 0; bottom: 13%;
    text-align: center; z-index: 3; pointer-events: none;
    opacity: 0; transform: translateY(14px);
    transition: opacity 1.1s ease 0.5s, transform 1.1s ease 0.5s;
  }
  #ca-splash.show .ca-splash-copy { opacity: 1; transform: none; }
  .ca-splash-title {
    font-size: clamp(2.4rem, 7vw, 4.4rem); letter-spacing: 0.16em; font-weight: 600;
    color: #f3dfa0; text-shadow: 0 0 28px rgba(212,175,55,0.4), 0 2px 0 rgba(0,0,0,0.5);
  }
  .ca-splash-sub {
    margin-top: 0.7rem; font-family: 'Courier New', monospace;
    font-size: clamp(0.72rem, 2.2vw, 0.95rem); letter-spacing: 0.32em;
    color: #d8c49a; text-transform: uppercase;
  }
  .ca-splash-tag {
    margin-top: 1.1rem; display: inline-block; font-family: 'Courier New', monospace;
    font-size: 0.7rem; letter-spacing: 0.2em; color: #caa75a;
    border: 1px solid rgba(212,175,55,0.3); border-radius: 2px; padding: 0.28rem 0.7rem;
    background: color-mix(in srgb, #d4af37 6%, transparent);
  }
  /* 点击门提示：1.2s 后浮现并持续呼吸 */
  .ca-splash-tap {
    position: absolute; left: 50%; bottom: 12%; transform: translateX(-50%); z-index: 4;
    font-family: 'Courier New', monospace; font-size: 0.82rem; letter-spacing: 0.26em;
    color: #e8c64a; text-shadow: 0 0 14px rgba(212,175,55,0.5);
    padding: 0.5rem 1.4rem; border: 1px solid rgba(212,175,55,0.28); border-radius: 2px;
    background: color-mix(in srgb, #d4af37 5%, transparent);
    opacity: 0; pointer-events: none; white-space: nowrap;
    transition: opacity 0.7s ease 1.2s;
  }
  #ca-splash.show .ca-splash-tap { opacity: 1; }
  #ca-splash.gone .ca-splash-tap { opacity: 0; transition: opacity 0.2s ease; }
  @media (prefers-reduced-motion: no-preference) {
    #ca-splash.show .ca-splash-tap { animation: caTapBreath 2.4s ease-in-out 1.9s infinite; }
  }
  @keyframes caTapBreath {
    0%, 100% { opacity: 0.55; box-shadow: 0 0 0 rgba(212,175,55,0); }
    50%      { opacity: 1;    box-shadow: 0 0 18px rgba(212,175,55,0.25); }
  }
  .ca-splash-never {
    position: absolute; left: 5%; bottom: 8%; z-index: 4;
    font-family: 'Courier New', monospace; font-size: 0.72rem; letter-spacing: 0.08em; color: #a88f5e;
    display: flex; align-items: center; gap: 0.45rem; cursor: pointer; user-select: none;
    opacity: 0; transition: opacity 0.8s ease 1.1s;
  }
  #ca-splash.show .ca-splash-never { opacity: 1; }
  .ca-splash-never input { accent-color: #d4af37; width: 14px; height: 14px; }
  .ca-splash-fallback {
    position: absolute; inset: 0; z-index: 2; display: none;
    align-items: center; justify-content: center; flex-direction: column; gap: 1.2rem;
    background: radial-gradient(800px 500px at 50% 45%, rgba(212,175,55,0.12), transparent 60%);
  }
  .ca-splash-fallback .ca-fb-medallion { width: 120px; height: 120px; position: relative; }
  .ca-splash-fallback .ca-fb-medallion::before,
  .ca-splash-fallback .ca-fb-medallion::after {
    content: ''; position: absolute; inset: 18px; border: 2px solid #d4af37;
    box-shadow: 0 0 40px rgba(212,175,55,0.5), inset 0 0 30px rgba(212,175,55,0.3);
  }
  .ca-splash-fallback .ca-fb-medallion::before { transform: rotate(0deg); }
  .ca-splash-fallback .ca-fb-medallion::after { transform: rotate(45deg); }
  .ca-splash-fallback .ca-fb-text {
    font-family: 'Courier New', monospace; letter-spacing: 0.3em; color: #f3dfa0; font-size: 1rem;
  }
  .ca-splash-hint {
    position: absolute; left: 0; right: 0; top: 8%; text-align: center; z-index: 3;
    font-family: 'Courier New', monospace; font-size: 0.66rem; letter-spacing: 0.18em; color: #8a7850;
    opacity: 0; transition: opacity 1s ease 1.2s; pointer-events: none;
  }
  #ca-splash.show .ca-splash-hint { opacity: 0.8; }
  @media (prefers-reduced-motion: no-preference) {
    .ca-splash-fallback .ca-fb-medallion::before,
    .ca-splash-fallback .ca-fb-medallion::after { animation: caFbPulse 2.6s ease-in-out infinite; }
    @keyframes caFbPulse {
      0%, 100% { box-shadow: 0 0 30px rgba(212,175,55,0.35), inset 0 0 22px rgba(212,175,55,0.25); }
      50% { box-shadow: 0 0 60px rgba(212,175,55,0.6), inset 0 0 40px rgba(212,175,55,0.45); }
    }
  }
</style>
{{ end }}
