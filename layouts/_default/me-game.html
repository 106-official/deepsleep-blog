<style>
/* === CSS 变量（必须在 :root，遵循项目硬约束）=== */
:root {
  --me-gold: #D4AF37;
  --me-gold-light: #F4E5B2;
  --me-gold-dark: #B8960C;
  --me-bg: #fafafa;
  --me-surface: #ffffff;
  --me-text: #2d2d2d;
  --me-text-secondary: #666666;
  --me-text-muted: #999999;
  --me-border: #e8e8e8;
  --me-radius: 12px;
  --me-shadow: 0 2px 12px rgba(0,0,0,0.06);
  --me-main-max: 1100px;
  --me-transition: 0.6s cubic-bezier(0.4, 0, 0.2, 1);
}

[data-theme="dark"] {
  --me-bg: #1a1a1a;
  --me-surface: #242424;
  --me-text: #e0e0e0;
  --me-text-secondary: #aaaaaa;
  --me-text-muted: #777777;
  --me-border: #333333;
  --me-shadow: 0 2px 12px rgba(0,0,0,0.3);
}

/* === 突破 PaperMod 768px 限制 === */
.main:has(.me-game-page) {
  max-width: 100% !important;
  margin: 0 !important;
  padding: 0 !important;
}

/* === 页面容器 === */
.me-game-page {
  min-width: 0;
  max-width: var(--me-main-max);
  margin: 0 auto;
  padding: 0 1.5rem;
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
  color: var(--me-text);
  background: var(--me-bg);
}

/* === Section 通用 === */
.me-section {
  padding: 4rem 0;
  border-top: 1px solid var(--me-border);
}

.me-section:first-child {
  border-top: none;
}

.me-section-title {
  font-family: 'Playfair Display', Georgia, serif;
  font-size: 1.8rem;
  font-weight: 700;
  margin: 0 0 0.5rem 0;
  color: var(--me-text);
  position: relative;
  display: inline-block;
}

.me-section-title::after {
  content: '';
  display: block;
  width: 48px;
  height: 3px;
  background: var(--me-gold);
  margin-top: 0.5rem;
  border-radius: 2px;
}

.me-section-num {
  font-family: 'SF Mono', Consolas, monospace;
  font-size: 0.8rem;
  color: var(--me-text-muted);
  letter-spacing: 0.1em;
  margin-bottom: 0.5rem;
  display: block;
}

/* === 滚动入场动画初始态（prefers-reduced-motion 降级）=== */
[data-animate] {
  opacity: 0;
  transform: translateY(20px);
  transition: opacity var(--me-transition), transform var(--me-transition);
}

[data-animate].in-view {
  opacity: 1;
  transform: none;
}

@media (prefers-reduced-motion: reduce) {
  [data-animate] {
    opacity: 1 !important;
    transform: none !important;
    transition: none !important;
  }
}

/* === 占位文本样式 === */
.me-placeholder {
  font-style: italic;
  color: var(--me-text-muted);
}

/* === Hero === */
.me-hero {
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 4rem 0;
  border-top: none;
}

.me-hero-inner {
  max-width: 640px;
}

.me-hero-avatar {
  width: 140px;
  height: 140px;
  border-radius: 50%;
  margin: 0 auto 1.5rem;
  overflow: hidden;
  border: 4px solid var(--me-gold);
  background: linear-gradient(135deg, var(--me-gold-light), var(--me-gold));
  display: flex;
  align-items: center;
  justify-content: center;
}

.me-hero-avatar img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.me-hero-avatar.avatar-fallback::before {
  content: '【头像】';
  font-family: 'Playfair Display', Georgia, serif;
  font-size: 2.5rem;
  color: #fff;
  font-weight: 700;
}

.me-hero-name {
  font-family: 'Playfair Display', Georgia, serif;
  font-size: 2.8rem;
  font-weight: 700;
  margin: 0 0 1rem 0;
  color: var(--me-text);
}

.me-hero-tagline {
  font-size: 1.1rem;
  color: var(--me-text-secondary);
  font-style: italic;
  min-height: 1.6em;
  margin: 0 0 2rem 0;
  line-height: 1.6;
}

.me-hero-scroll-hint {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 0.3rem;
  color: var(--me-text-muted);
  font-size: 0.85rem;
  margin-top: 3rem;
  transition: opacity 0.4s;
}

.me-hero-scroll-hint.hidden {
  opacity: 0;
  pointer-events: none;
}

.me-arrow {
  font-size: 1.4rem;
  animation: me-bounce 2s ease-in-out infinite;
}

@keyframes me-bounce {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(8px); }
}

@media (prefers-reduced-motion: reduce) {
  .me-arrow { animation: none; }
}

/* === Timeline === */
.me-timeline-track {
  position: relative;
  padding: 1rem 0;
  margin-top: 2rem;
}

.me-timeline-track::before {
  content: '';
  position: absolute;
  left: 50%;
  top: 0;
  bottom: 0;
  width: 2px;
  background: var(--me-border);
  transform: translateX(-50%);
}

.me-timeline-item {
  position: relative;
  width: 50%;
  padding: 1rem 2.5rem;
  margin-bottom: 1.5rem;
}

.me-timeline-item:nth-child(odd) {
  left: 0;
  text-align: right;
}

.me-timeline-item:nth-child(even) {
  left: 50%;
  text-align: left;
}

.me-timeline-node {
  position: absolute;
  top: 1.5rem;
  width: 14px;
  height: 14px;
  border-radius: 50%;
  background: var(--me-border);
  border: 3px solid var(--me-bg);
  transform: scale(1);
  transition: all 0.4s ease;
}

.me-timeline-item:nth-child(odd) .me-timeline-node {
  right: -7px;
}

.me-timeline-item:nth-child(even) .me-timeline-node {
  left: -7px;
}

.me-timeline-item.in-view .me-timeline-node {
  background: var(--me-gold);
  transform: scale(1.15);
  box-shadow: 0 0 0 4px rgba(212,175,55,0.2);
}

.me-timeline-card {
  background: var(--me-surface);
  border-radius: var(--me-radius);
  padding: 1.2rem 1.4rem;
  box-shadow: var(--me-shadow);
  display: inline-block;
  max-width: 100%;
}

.me-timeline-year {
  display: inline-block;
  font-family: 'SF Mono', Consolas, monospace;
  font-size: 0.8rem;
  color: var(--me-gold-dark);
  background: var(--me-gold-light);
  padding: 2px 10px;
  border-radius: 10px;
  margin-bottom: 0.5rem;
}

[data-theme="dark"] .me-timeline-year {
  color: var(--me-gold-light);
  background: rgba(212,175,55,0.15);
}

.me-timeline-title {
  font-family: 'Playfair Display', Georgia, serif;
  font-size: 1.15rem;
  margin: 0 0 0.5rem 0;
  color: var(--me-text);
}

.me-timeline-desc {
  font-size: 0.92rem;
  color: var(--me-text-secondary);
  line-height: 1.6;
  margin: 0;
  min-height: 1.6em;
}

/* === 打字机光标 === */
.me-cursor {
  display: inline-block;
  width: 2px;
  background: var(--me-gold);
  margin-left: 2px;
  animation: me-blink 1s step-end infinite;
  vertical-align: middle;
}

@keyframes me-blink {
  0%, 50% { opacity: 1; }
  51%, 100% { opacity: 0; }
}

.me-cursor.done {
  animation: none;
  opacity: 0;
  transition: opacity 0.3s;
}

@media (prefers-reduced-motion: reduce) {
  .me-cursor { display: none; }
}
</style>

</script>
