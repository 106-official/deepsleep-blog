{{ define "main" }}
<div class="play-page">
  <div class="play-header">
    <h1>娱乐中心</h1>
    <p class="subtitle">欢迎来到 DeepSleep 娱乐世界，放松心情，享受游戏时光！</p>
  </div>

  <div class="games-grid">
    <a href="/play/sleeptown/" class="game-card">
      <h2>SleepTown</h2>
      <p>鱼塘推理游戏</p>
      <span class="game-tag">推理</span>
    </a>

    <a href="/play/me/" class="game-card">
      <h2>关于我</h2>
      <p>交互式自我介绍</p>
      <span class="game-tag">叙事</span>
    </a>

    <div class="game-card disabled">
      <h2>更多游戏</h2>
      <p>敬请期待...</p>
      <span class="game-tag coming-soon">即将上线</span>
    </div>
  </div>
</div>

<style>
.play-page {
  max-width: 1000px;
  margin: 2rem auto;
  padding: 0 1.5rem;
}

.play-header {
  text-align: center;
  margin-bottom: 2.5rem;
  padding: 1.5rem;
  background: var(--color-bg, #fff);
  border-radius: 16px;
  box-shadow: 0 2px 12px rgba(0,0,0,0.08);
}

[data-theme="dark"] .play-header {
  background: #1e1e1e;
}

.play-header h1 {
  font-family: 'Playfair Display', Georgia, serif;
  font-size: 1.8rem;
  font-weight: 700;
  margin: 0 0 0.6rem 0;
  color: var(--color-text, #333);
}

[data-theme="dark"] .play-header h1 {
  color: #fff;
}

.subtitle {
  font-size: 0.95rem;
  color: #666;
  margin: 0;
}

.games-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
  gap: 1.2rem;
  margin-top: 1.5rem;
}

.game-card {
  background: var(--color-bg, #fff);
  border-radius: 12px;
  padding: 1.2rem 1.4rem;
  text-align: center;
  text-decoration: none;
  transition: all 0.3s ease;
  box-shadow: 0 2px 12px rgba(0,0,0,0.08);
  border: 2px solid transparent;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 0.5rem;
}

[data-theme="dark"] .game-card {
  background: #1e1e1e;
}

.game-card:hover:not(.disabled) {
  transform: translateY(-4px);
  box-shadow: 0 6px 18px rgba(212,175,55,0.25);
  border-color: var(--color-primary, #D4AF37);
}

.game-card.disabled {
  opacity: 0.6;
  cursor: not-allowed;
}

.game-card h2 {
  font-size: 1.15rem;
  margin: 0;
  color: var(--color-text, #333);
}

[data-theme="dark"] .game-card h2 {
  color: #fff;
}

.game-card p {
  font-size: 0.88rem;
  color: #888;
  margin: 0;
}

.game-tag {
  display: inline-block;
  padding: 3px 12px;
  border-radius: 12px;
  font-size: 0.75rem;
  font-weight: 600;
  background: linear-gradient(135deg, #D4AF37, #F4D03F);
  color: #000;
}

.coming-soon {
  background: #ccc;
  color: #666;
}

@media (max-width: 768px) {
  .games-grid {
    grid-template-columns: 1fr;
    gap: 1rem;
  }

  .play-header h1 {
    font-size: 1.5rem;
  }
}
</style>
{{ end }}
