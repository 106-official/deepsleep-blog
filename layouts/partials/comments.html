{{- /* Twikoo Comment System for PaperMod */ -}}
{{- if or (.Param "comments") (.Site.Params.comments) | default false -}}
  {{- if .IsPage -}}
    <div class="post-footer-comments">
      <h2 id="comments" style="
        font-size: 1.8rem;
        margin-top: 3rem;
        padding-bottom: 1rem;
        border-bottom: 3px solid #D4AF37;
        color: #2d2d2d;
        font-weight: 700;
      ">
        💬 发表评论
      </h2>
      
      <p style="color: #666; margin-bottom: 2rem; font-size: 0.95rem;">
        欢迎对这篇文章发表你的看法和见解 ✨
      </p>

      <div id="tcomment">
        <div style="text-align: center; padding: 2rem; color: #999;">
          <p>⏳ 评论加载中...</p>
        </div>
      </div>

      <script src="https://cdn.jsdelivr.net/npm/twikoo@1.6.39/dist/twikoo.all.min.js"></script>
      <script>
        (function() {
          var envId = '{{ .Site.Params.twikoo.envId }}';
          var el = document.getElementById('tcomment');
          
          if (!envId || envId === '') {
            console.error('[Twikoo] 错误: envId 未配置');
            if (el) {
              el.innerHTML = '<div style="text-align: center; padding: 2rem; color: #e74c3c;"><p>❌ 评论系统未正确配置</p><p style="font-size: 0.9rem; margin-top: 0.5rem;">请联系网站管理员</p></div>';
            }
            return;
          }

          try {
            twikoo.init({
              envId: envId,
              el: '#tcomment',
              path: '{{ .RelPermalink }}',
              lang: '{{ .Site.Params.twikoo.lang | default "zh-CN" }}',
              requiredMeta: {{ .Site.Params.twikoo.requiredMeta | default `["nick", "email"]` }},
              wordLimit: {{ .Site.Params.twikoo.wordLimit | default `[0, 500]` }},
              pageSize: {{ .Site.Params.twikoo.pageSize | default `10` }},
              reaction: {{ .Site.Params.twikoo.reaction | default `["👍", "🎉", "😄", "❤️", "🚀"]` }},
              placeholder: '欢迎发表你的看法~ 支持Markdown语法 ✨',
              imageUploader: false,
              highlight: {
                theme: 'monokai',
                lang: ['html', 'css', 'javascript', 'python', 'markdown'],
              },
              commentSorting: 'latest',
              dark: 'html[data-theme="dark"]',
            });
            
            console.log('[Twikoo] 初始化成功, envId:', envId);
          } catch (error) {
            console.error('[Twikoo] 初始化失败:', error);
            if (el) {
              el.innerHTML = '<div style="text-align: center; padding: 2rem; color: #e74c3c;"><p>❌ 评论系统加载失败</p><p style="font-size: 0.85rem; margin-top: 0.5rem; color: #666;">请稍后重试或联系管理员</p></div>';
            }
          }
        })();
      </script>

      <style>
        #tcomment {
          margin-top: 2rem;
          padding: 2rem;
          background: var(--color-bg-secondary, #ffffff);
          border-radius: 16px;
          box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
          border-left: 4px solid #D4AF37;
        }

        #tcomment .twikoo-header {
          display: none !important;
        }

        #tcomment .el-textarea__inner,
        #tcomment textarea {
          min-height: 150px !important;
          border-radius: 12px !important;
          border: 2px solid #e0e0e0 !important;
          transition: all 0.3s ease !important;
          font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif !important;
        }

        #tcomment .el-textarea__inner:focus,
        #tcomment textarea:focus {
          border-color: #D4AF37 !important;
          box-shadow: 0 0 0 3px rgba(212, 175, 55, 0.1) !important;
        }

        #tcomment .el-button--primary {
          background: linear-gradient(135deg, #D4AF37, #B8960C) !important;
          color: white !important;
          border: none !important;
          border-radius: 25px !important;
          padding: 10px 30px !important;
          font-weight: 600 !important;
        }

        #tcomment .twikoo-item {
          border-radius: 12px !important;
          padding: 1.5rem !important;
          margin-bottom: 1rem !important;
          background: #fafafa !important;
          transition: all 0.3s ease !important;
        }

        #tcomment .twikoo-item:hover {
          transform: translateX(5px);
          box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
        }

        #tcomment .tk-avatar {
          border-radius: 50% !important;
          border: 3px solid #D4AF37 !important;
        }

        #tcomment .tk-nick {
          font-weight: 600 !important;
          color: #D4AF37 !important;
        }

        @media (max-width: 768px) {
          #tcomment {
            padding: 1rem;
            margin-top: 1.5rem;
          }
        }
      </style>
    </div>
  {{- end -}}
{{- end -}}
