{{- /* Twikoo Comment System Integration */ -}}
{{- if .Site.Params.comments | default false -}}

<div id="tcomment"></div>

<script src="https://cdn.jsdelivr.net/npm/twikoo@1.6.39/dist/twikoo.all.min.js"></script>
<script>
  twikoo.init({
    envId: '{{ .Site.Params.twikoo.envId }}',
    el: '#tcomment',
    path: '{{ .RelPermalink }}',
    lang: '{{ .Site.Params.twikoo.lang | default "zh-CN" }}',
    requiredMeta: {{ .Site.Params.twikoo.requiredMeta | default `["nick", "email"]` }},
    wordLimit: {{ .Site.Params.twikoo.wordLimit | default `[0, 500]` }},
    pageSize: {{ .Site.Params.twikoo.pageSize | default `10` }},
    reaction: {{ .Site.Params.twikoo.reaction | default `["👍", "🎉", "😄", "❤️", "🚀"]` }},

    // 自定义占位文本
    placeholder: '欢迎发表你的看法~ 支持Markdown语法 ✨',

    // 图片上传
    imageUploader: false,

    // 高亮代码
    highlight: {
      theme: 'monokai',
      lang: ['html', 'css', 'javascript', 'python', 'markdown'],
    },

    // 评论排序
    commentSorting: 'latest',

    // 暗色模式
    dark: 'html[data-theme="dark"]',
  });
</script>

<style>
  /* Twikoo 评论区域美化 */
  #tcomment {
    margin-top: 3rem;
    padding: 2rem;
    background: var(--color-bg-secondary, #ffffff);
    border-radius: 16px;
    box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
    border-left: 4px solid #D4AF37;
  }

  /* 标题样式 */
  #tcomment .twikoo-header {
    border-bottom: 2px solid #D4AF37;
    margin-bottom: 1.5rem !important;
    padding-bottom: 0.8rem !important;
  }

  #tcomment .twikoo-header-title {
    font-size: 1.5rem !important;
    font-weight: 600 !important;
    color: #2d2d2d !important;
  }

  /* 输入框样式 */
  #tcomment .el-textarea__inner,
  #tcomment textarea {
    min-height: 150px !important;
    border-radius: 12px !important;
    border: 2px solid #e0e0e0 !important;
    transition: all 0.3s ease !important;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif !important;
    line-height: 1.6 !important;
  }

  #tcomment .el-textarea__inner:focus,
  #tcomment textarea:focus {
    border-color: #D4AF37 !important;
    box-shadow: 0 0 0 3px rgba(212, 175, 55, 0.1) !important;
  }

  /* 按钮样式 */
  #tcomment .el-button--primary {
    background: linear-gradient(135deg, #D4AF37, #B8960C) !important;
    color: white !important;
    border: none !important;
    border-radius: 25px !important;
    padding: 10px 30px !important;
    font-weight: 600 !important;
    transition: all 0.3s ease !important;
  }

  #tcomment .el-button--primary:hover {
    transform: translateY(-2px) !important;
    box-shadow: 0 6px 20px rgba(212, 175, 55, 0.4) !important;
  }

  /* 评论卡片样式 */
  #tcomment .twikoo-item {
    border-radius: 12px !important;
    padding: 1.5rem !important;
    margin-bottom: 1rem !important;
    background: #fafafa !important;
    transition: all 0.3s ease !important;
  }

  #tcomment .twikoo-item:hover {
    transform: translateX(5px);
    box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
  }

  /* 用户头像 */
  #tcomment .tk-avatar {
    border-radius: 50% !important;
    border: 3px solid #D4AF37 !important;
    width: 48px !important;
    height: 48px !important;
  }

  /* 用户名 */
  #tcomment .tk-nick {
    font-weight: 600 !important;
    color: #D4AF37 !important;
    text-decoration: none !important;
  }

  #tcomment .tk-nick:hover {
    color: #B8960C !important;
  }

  /* 时间戳 */
  #tcomment .tk-time {
    color: #999 !important;
    font-size: 0.9rem !important;
  }

  /* 表情选择器 */
  #tcomment .OwO-body {
    border-radius: 16px !important;
    box-shadow: 0 10px 40px rgba(0, 0, 0, 0.15) !important;
  }

  /* 登录/注册按钮 */
  #tcomment .tk-action-icon {
    color: #D4AF37 !important;
    font-weight: 600 !important;
  }

  /* 反应表情 */
  #tcomment .tk-reactions .tk-reaction-item {
    transition: all 0.2s ease !important;
  }

  #tcomment .tk-reactions .tk-reaction-item:hover {
    transform: scale(1.2) !important;
  }

  /* 加载动画 */
  @keyframes twikooFadeInUp {
    from {
      opacity: 0;
      transform: translateY(20px);
    }
    to {
      opacity: 1;
      transform: translateY(0);
    }
  }

  #tcomment {
    animation: twikooFadeInUp 0.6s ease-out;
  }

  /* 响应式调整 */
  @media (max-width: 768px) {
    #tcomment {
      padding: 1rem;
      margin-top: 2rem;
    }

    #tcomment .twikoo-header-title {
      font-size: 1.2rem !important;
    }

    #tcomment .tk-avatar {
      width: 36px !important;
      height: 36px !important;
    }
  }

  /* 暗色模式适配 */
  html[data-theme="dark"] #tcomment {
    background: var(--color-bg-secondary, #1a1a1a) !important;
  }

  html[data-theme="dark"] #tcomment .twikoo-item {
    background: #252525 !important;
  }

  html[data-theme="dark"] #tcomment .el-textarea__inner,
  html[data-theme="dark"] #tcomment textarea {
    background: #2d2d2d !important;
    color: #e0e0e0 !important;
    border-color: #444 !important;
  }
</style>

{{- end -}}
