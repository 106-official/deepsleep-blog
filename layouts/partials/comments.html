{{- /* Waline Comment System for PaperMod */ -}}
{{- if or (.Param "comments") (.Site.Params.comments) | default false -}}
  {{- if .IsPage -}}
    <div class="post-footer-comments">
      <h2 id="comments" style="
        font-size: 1.8rem;
        margin-top: 3rem;
        padding-bottom: 1rem;
        border-bottom: 3px solid #D4AF37;
        color: #2d2d2d;
        font-weight: 700;
      ">
        💬 发表评论
      </h2>

      <p style="color: #666; margin-bottom: 2rem; font-size: 0.95rem;">
        欢迎对这篇文章发表你的看法和见解 ✨
      </p>

      <div id="waline">
        <div style="text-align: center; padding: 2rem; color: #999;">
          <p>⏳ 评论加载中...</p>
        </div>
      </div>

      <link href="/css/waline.css" rel="stylesheet" />
      <script src="/js/waline.umd.min.js" onload="console.log('[Waline Script] ✅ JS文件onload事件触发')" onerror="console.error('[Waline Script] ❌ JS文件加载错误')"></script>
      <script>
        (function() {
          'use strict';
          
          // 安全日志函数 - 避免打印复杂对象
          function safeLog(msg, value) {
            try {
              if (value === undefined) {
                console.log(msg, 'undefined');
              } else if (value === null) {
                console.log(msg, 'null');
              } else if (typeof value === 'object') {
                // 只打印类型和基本属性，避免循环引用
                var typeStr = value.constructor ? value.constructor.name : 'Object';
                console.log(msg, typeStr);
              } else {
                console.log(msg, value);
              }
            } catch (e) {
              console.log(msg, '[无法序列化]');
            }
          }

          console.log('[Waline Init] 脚本开始执行');

          document.addEventListener('DOMContentLoaded', function() {
            console.log('[Waline Debug] DOMContentLoaded triggered');
            
            var WalineObj = null;
            try {
              WalineObj = window.Waline || (typeof Waline !== 'undefined' ? Waline : undefined);
            } catch (e) {
              console.error('[Waline] 访问 Waline 对象时出错:', e.message);
            }
            
            safeLog('[Waline Debug] typeof Waline:', typeof WalineObj);
            safeLog('[Waline Debug] Waline 对象类型:', WalineObj);

            var maxRetries = 30;  // 减少重试次数，避免长时间阻塞
            var retryCount = 0;
            var retryInterval = 300;
            var initTimer = null;

            function tryInitWaline() {
              try {
                // 重新获取 Waline 对象
                try {
                  WalineObj = window.Waline || (typeof Waline !== 'undefined' ? Waline : undefined);
                } catch (e) {
                  // 忽略访问错误
                }

                if (typeof WalineObj === 'undefined' || WalineObj === null) {
                  retryCount++;
                  if (retryCount <= maxRetries) {
                    console.log('[Waline Debug] 重试 #' + retryCount + '/' + maxRetries);
                    initTimer = setTimeout(tryInitWaline, retryInterval);
                    return;
                  }
                  console.error('[Waline] 错误: 重试' + maxRetries + '次后Waline仍未加载');
                  var el = document.getElementById('waline');
                  if (el) {
                    el.innerHTML = '<div style="text-align: center; padding: 2rem; color: #e74c3c;"><p>❌ 评论系统加载超时</p><p style="font-size: 0.85rem; margin-top: 0.5rem; color: #666;">请刷新页面重试</p></div>';
                  }
                  return;
                }

                // 清除定时器
                if (initTimer) {
                  clearTimeout(initTimer);
                  initTimer = null;
                }

                var serverURL = '{{ .Site.Params.waline.serverURL }}';
                var el = document.getElementById('waline');

                if (!serverURL || serverURL === '') {
                  console.error('[Waline] 错误: serverURL 未配置');
                  if (el) {
                    el.innerHTML = '<div style="text-align: center; padding: 2rem; color: #e74c3c;"><p>❌ 评论系统未正确配置</p><p style="font-size: 0.9rem; margin-top: 0.5rem;">请联系网站管理员</p></div>';
                  }
                  return;
                }

                // 获取初始化函数
                var WalineInit = null;
                try {
                  if (typeof WalineObj.init === 'function') {
                    WalineInit = WalineObj.init;
                  } else if (WalineObj.default && typeof WalineObj.default === 'function') {
                    WalineInit = WalineObj.default;
                  } else if (typeof WalineObj === 'function') {
                    WalineInit = WalineObj;
                  }
                } catch (e) {
                  console.error('[Waline] 获取初始化函数失败:', e.message);
                }

                safeLog('[Waline Debug] WalineInit 类型:', WalineInit);

                if (typeof WalineInit !== 'function') {
                  throw new Error('Waline初始化函数不存在, 类型: ' + typeof WalineInit);
                }

                // Waline 配置
                var walineConfig = {
                  el: '#waline',
                  serverURL: serverURL,
                  path: '{{ .RelPermalink }}',
                  lang: 'zh-CN',
                  emoji: ['https://cdn.jsdelivr.net/npm/@waline/emojis@1.1.0/bilibili'],
                  requiredMeta: ['nick', 'email'],
                  wordLimit: [0, 500],
                  pageSize: 10,
                  placeholder: '欢迎发表你的看法~ 支持Markdown语法 ✨',
                  imageUploader: false,
                  highlighter: false,
                  commentSorting: 'latest',
                  dark: 'html[data-theme="dark"]',
                  login: 'enable',
                  footer: '<a href="https://waline.js.org" target="_blank" rel="noopener noreferrer">Waline</a> powered',
                  
                  // 添加错误处理回调
                  onError: function(error) {
                    console.error('[Waline] 运行时错误:', error);
                    // 显示用户友好的错误信息
                    var errorEl = document.querySelector('#waline .wl-meta');
                    if (errorEl) {
                      errorEl.innerHTML = '<span style="color: #e74c3c;">评论加载失败，请稍后重试</span>';
                    }
                  }
                };

                // 执行初始化
                WalineInit(walineConfig);

                console.log('[Waline] ✅ 初始化成功, serverURL:', serverURL, '(重试次数:', retryCount + ')');
                
                // 添加全局错误处理
                window.addEventListener('error', function(e) {
                  if (e.message && e.message.includes('Waline')) {
                    console.error('[Waline] 捕获到全局错误:', e.message);
                  }
                });

              } catch (error) {
                console.error('[Waline] 初始化失败:', error.message || error);
                if (error.stack) {
                  console.error('[Waline] 错误堆栈:', error.stack.split('\n')[0]);
                }
                var el = document.getElementById('waline');
                if (el) {
                  el.innerHTML = '<div style="text-align: center; padding: 2rem; color: #e74c3c;"><p>❌ 评论系统加载失败</p><p style="font-size: 0.85rem; margin-top: 0.5rem; color: #666;">请稍后重试或联系管理员</p></div>';
                }
              }
            }

            // 延迟启动初始化，确保 DOM 完全就绪
            setTimeout(tryInitWaline, 100);
          });
        })();
      </script>

      <style>
        #waline {
          margin-top: 2rem;
          padding: 2rem;
          background: var(--color-bg-secondary, #ffffff);
          border-radius: 16px;
          box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
          border-left: 4px solid #D4AF37;
        }

        #waline .wl-editor,
        #waline textarea {
          min-height: 150px !important;
          border-radius: 12px !important;
          border: 2px solid #e0e0e0 !important;
          transition: all 0.3s ease !important;
          font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif !important;
        }

        #waline .wl-editor:focus,
        #waline textarea:focus {
          border-color: #D4AF37 !important;
          box-shadow: 0 0 0 3px rgba(212, 175, 55, 0.1) !important;
        }

        #waline .wl-btn-primary {
          background: linear-gradient(135deg, #D4AF37, #B8960C) !important;
          color: white !important;
          border: none !important;
          border-radius: 25px !important;
          padding: 10px 30px !important;
          font-weight: 600 !important;
          cursor: pointer !important;
          transition: all 0.3s ease !important;
        }

        #waline .wl-btn-primary:hover {
          transform: translateY(-2px) !important;
          box-shadow: 0 4px 12px rgba(212, 175, 55, 0.3) !important;
        }

        #waline .wl-btn-primary:disabled {
          opacity: 0.6 !important;
          cursor: not-allowed !important;
          transform: none !important;
        }

        #waline .wl-item {
          border-radius: 12px !important;
          padding: 1.5rem !important;
          margin-bottom: 1rem !important;
          background: #fafafa !important;
          transition: all 0.3s ease !important;
        }

        #waline .wl-item:hover {
          transform: translateX(5px);
          box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
        }

        #waline .wl-user {
          display: none !important;
        }

        #waline .wl-avatar {
          border-radius: 50% !important;
          border: 3px solid #D4AF37 !important;
        }

        #waline .wl-nick {
          font-weight: 600 !important;
          color: #D4AF37 !important;
        }

        /* 添加错误状态样式 */
        #waline .wl-error {
          color: #e74c3c !important;
          padding: 1rem !important;
          background: #fdf2f2 !important;
          border-radius: 8px !important;
          margin: 1rem 0 !important;
        }

        @media (max-width: 768px) {
          #waline {
            padding: 1rem;
            margin-top: 1.5rem;
          }
        }

        [data-theme="dark"] #waline {
          background: var(--color-bg-secondary, #181818);
          box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
          border-left-color: #D4AF37;
        }

        [data-theme="dark"] #waline .wl-editor,
        [data-theme="dark"] #waline textarea {
          border-color: #444 !important;
          background: #222 !important;
          color: #e0e0e0 !important;
        }

        [data-theme="dark"] #waline .wl-editor:focus,
        [data-theme="dark"] #waline textarea:focus {
          border-color: #D4AF37 !important;
          box-shadow: 0 0 0 3px rgba(212, 175, 55, 0.15) !important;
        }

        [data-theme="dark"] #waline .wl-item {
          background: #222 !important;
          color: #ccc !important;
        }

        [data-theme="dark"] #waline .wl-item:hover {
          box-shadow: 0 4px 15px rgba(0, 0, 0, 0.25);
        }

        [data-theme="dark"] #waline .wl-nick {
          color: #D4AF37 !important;
        }

        [data-theme="dark"] #waline .wl-error {
          background: #2a1515 !important;
          color: #ff6b6b !important;
        }

        [data-theme="dark"] h2#comments {
          color: #e0e0e0;
        }

        [data-theme="dark"] .post-footer-comments > p[style*="color: #666"],
        [data-theme="dark"] .post-footer-comments > p:first-of-type {
          color: #999 !important;
        }
      </style>
    </div>
  {{- end -}}
{{- end -}}
