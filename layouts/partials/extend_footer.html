<!-- 主题切换圆形扩散动画 (View Transitions API) v5.6 -->
<script>
(function() {
  var toggle = document.getElementById('theme-toggle');
  if (!toggle) return;

  // 不支持 View Transitions API 或用户偏好减少动画 → 不拦截，走 PaperMod 原生逻辑
  if (!document.startViewTransition || window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
    return;
  }

  // 捕获阶段拦截原生 click（PaperMod footer.html:96 在 bubbling 阶段绑定）
  toggle.addEventListener('click', function(e) {
    // 计算圆形扩散中心和半径（覆盖到屏幕最远角）
    var rect = toggle.getBoundingClientRect();
    var x = rect.left + rect.width / 2;
    var y = rect.top + rect.height / 2;
    var endRadius = Math.hypot(
      Math.max(x, window.innerWidth - x),
      Math.max(y, window.innerHeight - y)
    );

    // 当前是否为暗色主题（切换前状态）
    var isDark = document.documentElement.dataset.theme === 'dark';

    // 阻止 PaperMod 原生 click 处理（bubbling 阶段不会再触发）
    e.stopImmediatePropagation();

    // 用 startViewTransition 包裹主题切换
    var transition = document.startViewTransition(function() {
      var html = document.documentElement;
      if (isDark) {
        html.dataset.theme = 'light';
        localStorage.setItem('pref-theme', 'light');
      } else {
        html.dataset.theme = 'dark';
        localStorage.setItem('pref-theme', 'dark');
      }
    });

    transition.ready.then(function() {
      var clipPath = [
        'circle(0px at ' + x + 'px ' + y + 'px)',
        'circle(' + endRadius + 'px at ' + x + 'px ' + y + 'px)'
      ];
      // 双向自适应：亮→暗 用黑幕从按钮合拢覆盖；暗→亮 用反向光明绽放
      document.documentElement.animate(
        { clipPath: isDark ? clipPath : clipPath.reverse() },
        {
          duration: 600,
          easing: 'cubic-bezier(0.4, 0, 0.2, 1)',
          pseudoElement: '::view-transition-new(root)'
        }
      );
    }).catch(function() {
      // 动画失败时无需额外处理，主题已在 transition 回调中切换
    });
  }, true); // 捕获阶段
})();
</script>

<!-- 字体大小调节 v5.7 -->
<script>
(function() {
  var STORAGE_KEY = 'pref-font-scale';
  var SCALES = [
    { value: 0.8,  label: '80%'  },
    { value: 0.9,  label: '90%'  },
    { value: 1.0,  label: '100%' },
    { value: 1.1,  label: '110%' },
    { value: 1.2,  label: '120%' }
  ];

  // 应用缩放（在注入按钮前先设置 CSS 变量，避免首屏闪烁）
  function applyScale(value) {
    document.documentElement.style.setProperty('--font-scale', value);
  }

  // 初始化时恢复持久化值
  var saved = parseFloat(localStorage.getItem(STORAGE_KEY));
  if (!isNaN(saved)) {
    applyScale(saved);
  }

  function initFontToggle() {
    var logoSwitches = document.querySelector('.logo-switches');
    if (!logoSwitches) return;

    // 重复注入防护（社区页历史 Bug 防御）
    if (document.querySelector('.font-toggle-wrap')) return;

    // ---- 1. 创建容器 + "Aa" 按钮 ----
    var wrap = document.createElement('div');
    wrap.className = 'font-toggle-wrap';

    var btn = document.createElement('button');
    btn.className = 'font-toggle';
    btn.type = 'button';
    btn.setAttribute('aria-label', '调节字体大小');
    btn.setAttribute('title', '字体大小');
    btn.textContent = 'Aa';

    // ---- 2. 创建弹窗 ----
    var popup = document.createElement('div');
    popup.className = 'font-popup';
    popup.setAttribute('role', 'menu');

    var currentScale = isNaN(saved) ? 1.0 : saved;

    SCALES.forEach(function(s) {
      var item = document.createElement('button');
      item.type = 'button';
      item.className = 'font-scale-btn';
      item.textContent = s.label;
      item.setAttribute('data-scale', s.value);
      item.setAttribute('role', 'menuitemradio');
      if (Math.abs(s.value - currentScale) < 0.001) {
        item.classList.add('active');
        item.setAttribute('aria-checked', 'true');
      }
      item.addEventListener('click', function(e) {
        e.stopPropagation();
        applyScale(s.value);
        localStorage.setItem(STORAGE_KEY, String(s.value));
        // 更新 active 高亮
        popup.querySelectorAll('.font-scale-btn').forEach(function(el) {
          el.classList.remove('active');
          el.removeAttribute('aria-checked');
        });
        item.classList.add('active');
        item.setAttribute('aria-checked', 'true');
        // 选中后自动关闭
        closePopup();
      });
      popup.appendChild(item);
    });

    // ---- 3. 组装并注入到 .logo-switches（#theme-toggle 之后）----
    wrap.appendChild(btn);
    wrap.appendChild(popup);
    logoSwitches.appendChild(wrap);

    // ---- 4. 按钮点击切换弹窗 ----
    btn.addEventListener('click', function(e) {
      e.stopPropagation();
      popup.classList.toggle('open');
    });

    // ---- 5. 关闭逻辑 ----
    function closePopup() {
      popup.classList.remove('open');
    }

    // 点击外部关闭
    document.addEventListener('click', function(e) {
      if (!wrap.contains(e.target)) {
        closePopup();
      }
    });

    // ESC 关闭
    document.addEventListener('keydown', function(e) {
      if (e.key === 'Escape') {
        closePopup();
      }
    });
  }

  // 页面加载完成后初始化（与 initGlobalProfile 同模式）
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', initFontToggle);
  } else {
    initFontToggle();
  }
})();
</script>

<script>
(function () {
  // ============ KaTeX 数学公式渲染（动态按需加载）============
  // 仅当页面存在含 LaTeX 公式的正文容器(.md-content)时才加载 KaTeX，
  // 避免娱乐/首页等无关页面白白下载 ~300KB 脚本。
  var targets = document.querySelectorAll('.md-content');
  if (!targets.length) return;

  var hasMath = false;
  for (var i = 0; i < targets.length; i++) {
    var t = targets[i].textContent;
    if (/\$\$|\\\[|\\\(|\$[^$]/.test(t)) { hasMath = true; break; }
  }
  if (!hasMath) return;

  // CDN 源（jsdelivr 主 + bootcdn 国内备用，失败自动切换）
  var CDNS = [
    {
      css: 'https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css',
      js: 'https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js',
      render: 'https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js'
    },
    {
      css: 'https://cdn.bootcdn.net/ajax/libs/KaTeX/0.16.11/katex.min.css',
      js: 'https://cdn.bootcdn.net/ajax/libs/KaTeX/0.16.11/katex.min.js',
      render: 'https://cdn.bootcdn.net/ajax/libs/KaTeX/0.16.11/contrib/auto-render.min.js'
    }
  ];

  function loadScript(src, onload, onerror) {
    var s = document.createElement('script');
    s.src = src;
    s.onload = onload;
    s.onerror = onerror;
    document.head.appendChild(s);
  }

  // 公式中的 % 在 LaTeX 里是注释符，会把 % 后的内容全部吞掉（如 4% 只显示 4）。
  // 渲染前遍历文本节点，把 $...$/$$...$$ 片段内的 % 转义为 \%。
  function escapePercentInMath(node) {
    var text = node.nodeValue;
    if (text.indexOf('%') === -1 && text.indexOf('$') === -1) return;
    var out = '';
    var i = 0, len = text.length;
    while (i < len) {
      if (text[i] === '$') {
        if (text[i + 1] === '$') {
          var end = text.indexOf('$$', i + 2);
          if (end !== -1) {
            out += '$$' + text.slice(i + 2, end).replace(/%/g, '\\%') + '$$';
            i = end + 2;
            continue;
          }
        } else {
          var end2 = text.indexOf('$', i + 1);
          if (end2 !== -1) {
            out += '$' + text.slice(i + 1, end2).replace(/%/g, '\\%') + '$';
            i = end2 + 1;
            continue;
          }
        }
      }
      out += text[i];
      i++;
    }
    if (out !== text) node.nodeValue = out;
  }

  function renderWithKaTeX() {
    if (!window.renderMathInElement || !window.katex) return;
    var opts = {
      delimiters: [
        { left: '$$', right: '$$', display: true },
        { left: '\\[', right: '\\]', display: true },
        { left: '$', right: '$', display: false },
        { left: '\\(', right: '\\)', display: false }
      ],
      throwOnError: false,
      errorColor: '#cc0000',
      strict: false
    };
    targets.forEach(function (el) {
      // 先转义公式内的 %，再交给 auto-render 渲染
      var walker = document.createTreeWalker(el, NodeFilter.SHOW_TEXT);
      var nodes = [];
      while (walker.nextNode()) nodes.push(walker.currentNode);
      nodes.forEach(escapePercentInMath);
      renderMathInElement(el, opts);
    });
  }

  function tryLoad(level) {
    if (level >= CDNS.length) return;
    var cdn = CDNS[level];
    loadScript(cdn.js, function () {
      loadScript(cdn.render, renderWithKaTeX, function () { tryLoad(level + 1); });
    }, function () { tryLoad(level + 1); });
  }

  tryLoad(0);
})();
</script>
