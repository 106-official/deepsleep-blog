{{- /* Custom footer additions - 全局功能 */ -}}

<script src="{{ "js/community.js" | relURL }}"></script>

<script>
(function() {
  function initGlobalProfile() {
    const menu = document.getElementById('menu');
    if (!menu) return;

    // 创建并添加"个人"按钮到导航栏
    const profileBtn = document.createElement('button');
    profileBtn.className = 'global-profile-btn';
    profileBtn.innerHTML = '👤 个人';

    // 点击跳转到个人资料页面（而非弹出Modal）
    profileBtn.onclick = function() {
      window.location.href = '/profile/';
    };

    // 添加到菜单后面
    menu.parentNode.insertBefore(profileBtn, menu.nextSibling);
  }

  // 页面加载完成后初始化
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', initGlobalProfile);
  } else {
    initGlobalProfile();
  }
})();
</script>

<!-- 主题切换圆形扩散动画 (View Transitions API) v5.6 -->
<script>
(function() {
  var toggle = document.getElementById('theme-toggle');
  if (!toggle) return;

  // 不支持 View Transitions API 或用户偏好减少动画 → 不拦截，走 PaperMod 原生逻辑
  if (!document.startViewTransition || window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
    return;
  }

  // 捕获阶段拦截原生 click（PaperMod footer.html:96 在 bubbling 阶段绑定）
  toggle.addEventListener('click', function(e) {
    // 计算圆形扩散中心和半径（覆盖到屏幕最远角）
    var rect = toggle.getBoundingClientRect();
    var x = rect.left + rect.width / 2;
    var y = rect.top + rect.height / 2;
    var endRadius = Math.hypot(
      Math.max(x, window.innerWidth - x),
      Math.max(y, window.innerHeight - y)
    );

    // 当前是否为暗色主题（切换前状态）
    var isDark = document.documentElement.dataset.theme === 'dark';

    // 阻止 PaperMod 原生 click 处理（bubbling 阶段不会再触发）
    e.stopImmediatePropagation();

    // 用 startViewTransition 包裹主题切换
    var transition = document.startViewTransition(function() {
      var html = document.documentElement;
      if (isDark) {
        html.dataset.theme = 'light';
        localStorage.setItem('pref-theme', 'light');
      } else {
        html.dataset.theme = 'dark';
        localStorage.setItem('pref-theme', 'dark');
      }
    });

    transition.ready.then(function() {
      var clipPath = [
        'circle(0px at ' + x + 'px ' + y + 'px)',
        'circle(' + endRadius + 'px at ' + x + 'px ' + y + 'px)'
      ];
      // 双向自适应：亮→暗 用黑幕从按钮合拢覆盖；暗→亮 用反向光明绽放
      document.documentElement.animate(
        { clipPath: isDark ? clipPath : clipPath.reverse() },
        {
          duration: 600,
          easing: 'cubic-bezier(0.4, 0, 0.2, 1)',
          pseudoElement: '::view-transition-new(root)'
        }
      );
    }).catch(function() {
      // 动画失败时无需额外处理，主题已在 transition 回调中切换
    });
  }, true); // 捕获阶段
})();
</script>
