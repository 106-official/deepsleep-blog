{{- /* Custom head additions for DeepSleep Blog */ -}}
<link rel="stylesheet" href="{{ "css/custom.css" | relURL }}" />
<link rel="stylesheet" href="{{ "css/community.css" | relURL }}" />

<!-- KaTeX 数学公式样式（CPA 等学习章节 LaTeX 渲染） -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css" />

<!-- Google Fonts - 优雅字体 -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>
  :root {
    --font-serif: 'Playfair Display', Georgia, serif;
    --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
  }

  /* ============================================
     暗色模式覆盖（v5.8）
     修复 custom.css 中硬编码白色渐变背景 + 深色文字
     在非 .list 页面（如 /lixin/、/me/ 等）暗色模式下仍为白色的问题
     ============================================ */
  [data-theme="dark"] body {
    /* 覆盖 custom.css:40 的 linear-gradient(135deg, #fafafa, #f0f0f0) */
    background: var(--theme) !important;
    /* 覆盖 custom.css:39 的 color: var(--color-text-primary) = #2d2d2d */
    color: var(--primary) !important;
  }

  /* ============================================
     移动端 sidebar 汉堡按钮让位 (v5.8)
     修复移动端汉堡按钮(fixed; left:14px; width:42px; z-index:200)
     挡住 PaperMod logo 的问题
     ============================================ */
  @media (max-width: 1024px) {
    /* 有 sidebar 汉堡按钮的页面(lixin/learn/posts/resources/sleeptown)，
       给 header-nav 加 padding-left 让 logo 往右移避开汉堡按钮区域 */
    body:has(.lx-menu-toggle, .learn-menu-toggle, .posts-menu-toggle, .resources-menu-toggle, .stagemode-menu-toggle) .header-nav {
      padding-left: 60px;
    }
  }

  /* 个人资料页面通用表单样式 */
  .c-form-input {
    width: 100%;
    padding: 10px 14px;
    border: 2px solid #e0e0e0;
    border-radius: 8px;
    font-size: 1rem;
    transition: border-color 0.2s;
    background: #fff;
    color: #333;
  }

  .c-form-input:focus {
    outline: none;
    border-color: var(--color-primary, #D4AF37);
    box-shadow: 0 0 0 3px rgba(212,175,55,0.1);
  }

  [data-theme="dark"] .c-form-input {
    background: #2a2a2a;
    border-color: #444;
    color: #e0e0e0;
  }

  [data-theme="dark"] .c-form-input:focus {
    border-color: var(--color-primary, #D4AF37);
  }

  .c-btn {
    display: inline-block;
    padding: 10px 24px;
    border: none;
    border-radius: 8px;
    font-size: 0.95rem;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
    text-align: center;
  }

  .c-btn-primary {
    background: var(--color-primary, #D4AF37);
    color: #000;
  }

  .c-btn-primary:hover {
    opacity: 0.9;
    transform: translateY(-1px);
    box-shadow: 0 4px 12px rgba(212,175,55,0.3);
  }

  .c-btn-secondary {
    background: #f0f0f0;
    color: #333;
  }

  .c-btn-secondary:hover {
    background: #e0e0e0;
  }

  [data-theme="dark"] .c-btn-secondary {
    background: #3a3a3a;
    color: #e0e0e0;
  }

  .c-error {
    padding: 12px 16px;
    background: #fee;
    color: #c33;
    border-radius: 8px;
    margin-bottom: 1rem;
    border-left: 4px solid #c33;
    font-size: 0.9rem;
  }

  .c-success {
    padding: 12px 16px;
    background: #efe;
    color: #363;
    border-radius: 8px;
    margin-bottom: 1rem;
    border-left: 4px solid #363;
    font-size: 0.9rem;
  }

  [data-theme="dark"] .c-error {
    background: #4a2020;
    color: #ff6666;
  }

  [data-theme="dark"] .c-success {
    background: #203a20;
    color: #66ff66;
  }

  /* ==================== 主题切换圆形扩散动画 (View Transitions API) v5.6 ==================== */
  /* 禁用默认的 cross-fade，改用自定义 clip-path 动画 */
  ::view-transition-old(root),
  ::view-transition-new(root) {
    animation: none;
    mix-blend-mode: normal;
  }
  /* 旧主题层级在下，新主题用 clip-path 揭示 */
  ::view-transition-old(root) {
    z-index: 1;
  }
  ::view-transition-new(root) {
    z-index: 9999;
  }
  /* 尊重用户减少动画偏好 */
  @media (prefers-reduced-motion: reduce) {
    ::view-transition-old(root),
    ::view-transition-new(root) {
      animation: none !important;
    }
  }

  /* ==================== 字体大小调节 v5.7 ==================== */
  :root {
    --font-scale: 1; /* JS 读取 localStorage 后通过 setProperty 覆盖 */
  }

  /* 缩放 rem 基准（1rem = 16px * --font-scale） */
  html {
    font-size: calc(100% * var(--font-scale, 1));
  }

  /* 关键：覆盖 custom.css:42 的 body { font-size: 16px }，让正文跟随 html 缩放 */
  body {
    font-size: 1rem !important;
  }

  /* 字体调节按钮容器（包裹按钮+弹窗，提供定位上下文） */
  .font-toggle-wrap {
    position: relative;
    display: inline-flex;
    align-items: center;
    min-height: inherit;
  }

  /* "Aa" 按钮：复用 theme-toggle 的无边框/继承字体语言 */
  .font-toggle {
    padding: 0 0.4rem;
    font-family: var(--font-serif, 'Playfair Display', serif);
    font-size: 1.05rem;
    font-weight: 600;
    line-height: 1;
    color: var(--primary);
    cursor: pointer;
    background: 0 0;
    border: 0;
    display: inline-flex;
    align-items: center;
    transition: opacity 0.2s;
  }

  .font-toggle:hover {
    opacity: 0.6;
  }

  /* 弹窗：绝对定位在按钮下方居中 */
  .font-popup {
    position: absolute;
    top: calc(100% + 8px);
    left: 50%;
    transform: translateX(-50%) translateY(-4px);
    display: flex;
    flex-direction: column;
    gap: 2px;
    min-width: 96px;
    padding: 6px;
    background: var(--theme, #fff);
    border: 1px solid var(--border, #e0e0e0);
    border-radius: var(--radius, 8px);
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.12);
    z-index: 1000;
    opacity: 0;
    visibility: hidden;
    transition: opacity 0.18s ease, transform 0.18s ease, visibility 0.18s;
  }

  .font-popup.open {
    opacity: 1;
    visibility: visible;
    transform: translateX(-50%) translateY(0);
  }

  /* 弹窗小箭头 */
  .font-popup::before {
    content: '';
    position: absolute;
    top: -5px;
    left: 50%;
    transform: translateX(-50%) rotate(45deg);
    width: 8px;
    height: 8px;
    background: var(--theme, #fff);
    border-top: 1px solid var(--border, #e0e0e0);
    border-left: 1px solid var(--border, #e0e0e0);
  }

  /* 档位按钮 */
  .font-popup .font-scale-btn {
    padding: 6px 10px;
    font-size: 0.85rem;
    font-family: var(--font-sans, sans-serif);
    color: var(--primary);
    background: 0 0;
    border: 0;
    border-radius: 4px;
    cursor: pointer;
    text-align: center;
    transition: background 0.15s, color 0.15s;
    white-space: nowrap;
  }

  .font-popup .font-scale-btn:hover {
    background: var(--code-bg, #f5f5f5);
  }

  /* 选中档位高亮：金色背景 + 黑字 */
  .font-popup .font-scale-btn.active {
    background: #D4AF37;
    color: #000;
    font-weight: 600;
  }
</style>
