{{- /* Custom head additions for DeepSleep Blog */ -}}
<link rel="stylesheet" href="{{ "css/custom.css" | relURL }}" />
<link rel="stylesheet" href="{{ "css/community.css" | relURL }}" />

<!-- Google Fonts - 优雅字体 -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>
  :root {
    --font-serif: 'Playfair Display', Georgia, serif;
    --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
  }
  
  /* 全局个人按钮样式 */
  .global-profile-btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 8px 16px !important;
    margin-left: 12px;
    background: var(--color-primary, #D4AF37) !important;
    color: #000 !important;
    border: none;
    border-radius: 8px;
    font-size: 0.9rem !important;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
    white-space: nowrap;
  }
  
  .global-profile-btn:hover {
    opacity: 0.9;
    transform: translateY(-1px);
    box-shadow: 0 4px 12px rgba(212,175,55,0.3);
  }

  /* 个人资料页面通用表单样式 */
  .c-form-input {
    width: 100%;
    padding: 10px 14px;
    border: 2px solid #e0e0e0;
    border-radius: 8px;
    font-size: 1rem;
    transition: border-color 0.2s;
    background: #fff;
    color: #333;
  }

  .c-form-input:focus {
    outline: none;
    border-color: var(--color-primary, #D4AF37);
    box-shadow: 0 0 0 3px rgba(212,175,55,0.1);
  }

  [data-theme="dark"] .c-form-input {
    background: #2a2a2a;
    border-color: #444;
    color: #e0e0e0;
  }

  [data-theme="dark"] .c-form-input:focus {
    border-color: var(--color-primary, #D4AF37);
  }

  .c-btn {
    display: inline-block;
    padding: 10px 24px;
    border: none;
    border-radius: 8px;
    font-size: 0.95rem;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
    text-align: center;
  }

  .c-btn-primary {
    background: var(--color-primary, #D4AF37);
    color: #000;
  }

  .c-btn-primary:hover {
    opacity: 0.9;
    transform: translateY(-1px);
    box-shadow: 0 4px 12px rgba(212,175,55,0.3);
  }

  .c-btn-secondary {
    background: #f0f0f0;
    color: #333;
  }

  .c-btn-secondary:hover {
    background: #e0e0e0;
  }

  [data-theme="dark"] .c-btn-secondary {
    background: #3a3a3a;
    color: #e0e0e0;
  }

  .c-error {
    padding: 12px 16px;
    background: #fee;
    color: #c33;
    border-radius: 8px;
    margin-bottom: 1rem;
    border-left: 4px solid #c33;
    font-size: 0.9rem;
  }

  .c-success {
    padding: 12px 16px;
    background: #efe;
    color: #363;
    border-radius: 8px;
    margin-bottom: 1rem;
    border-left: 4px solid #363;
    font-size: 0.9rem;
  }

  [data-theme="dark"] .c-error {
    background: #4a2020;
    color: #ff6666;
  }

  [data-theme="dark"] .c-success {
    background: #203a20;
    color: #66ff66;
  }
</style>
