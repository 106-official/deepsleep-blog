<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>SleepTown · 开场（原型）</title>
<style>
  :root{
    --st-bg:#0b1320;
    --st-bg2:#131f33;
    --st-lamp:#e8c87a;
    --st-lamp-strong:#f5d78a;
    --st-lamp-soft:#f5d78a;
    --st-bg-glow:rgba(232,200,122,0.16);
    --st-serif:"Georgia","Songti SC","Noto Serif SC",serif;
    --st-typewriter:"Courier New","Noto Sans Mono CJK SC",monospace;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{height:100%;overflow:hidden;background:#05080f;}
  #splash{
    position:fixed;inset:0;z-index:9999;
    background:
      radial-gradient(1200px 520px at 50% 42%, var(--st-bg-glow), transparent 62%),
      radial-gradient(900px 900px at 50% 60%, rgba(11,19,32,0.0), rgba(5,8,15,0.9) 75%),
      linear-gradient(180deg, var(--st-bg), var(--st-bg2));
    opacity:0;transition:opacity 0.9s ease;
    font-family:var(--st-serif);color:#e9e2d0;
  }
  #splash.show{opacity:1;}
  #splash.gone{opacity:0;pointer-events:none;}
  #splash-canvas{position:absolute;inset:0;width:100%;height:100%;display:block;}
  /* 文案层 */
  .splash-copy{
    position:absolute;left:0;right:0;bottom:13%;
    text-align:center;z-index:3;pointer-events:none;
    opacity:0;transform:translateY(14px);
    transition:opacity 1.1s ease 0.5s, transform 1.1s ease 0.5s;
  }
  #splash.show .splash-copy{opacity:1;transform:none;}
  .splash-title{
    font-size:clamp(2.4rem,7vw,4.6rem);letter-spacing:.14em;font-weight:600;
    color:var(--st-lamp-strong);
    text-shadow:0 0 26px rgba(232,200,122,.38), 0 2px 0 rgba(0,0,0,.5);
  }
  .splash-sub{
    margin-top:.7rem;font-family:var(--st-typewriter);
    font-size:clamp(.72rem,2.2vw,.95rem);letter-spacing:.34em;
    color:#b9c2d4;text-transform:uppercase;
  }
  .splash-tag{
    margin-top:1.1rem;display:inline-block;font-family:var(--st-typewriter);
    font-size:.7rem;letter-spacing:.2em;color:#8c97ad;
    border:1px solid rgba(232,200,122,.28);border-radius:2px;
    padding:.28rem .7rem;background:color-mix(in srgb,var(--st-lamp) 6%, transparent);
  }
  /* 按钮 */
  .splash-enter{
    position:absolute;right:6%;bottom:7%;z-index:4;
    font-family:var(--st-typewriter);font-size:.95rem;letter-spacing:.18em;
    color:var(--st-bg);background:linear-gradient(180deg,var(--st-lamp-strong),var(--st-lamp));
    border:none;border-radius:3px;padding:.7rem 1.5rem;cursor:pointer;
    box-shadow:0 0 22px rgba(232,200,122,.4);transition:transform .15s ease, filter .15s ease;
    opacity:0;transition:opacity .8s ease 1s, transform .15s ease;
  }
  #splash.show .splash-enter{opacity:1;}
  .splash-enter:hover{transform:translateY(-2px);filter:brightness(1.06);}
  .splash-skip{
    position:absolute;top:5%;right:5%;z-index:4;
    font-family:var(--st-typewriter);font-size:.8rem;letter-spacing:.12em;
    color:#9aa6bd;background:transparent;border:1px solid rgba(154,166,189,.35);
    border-radius:3px;padding:.4rem .9rem;cursor:pointer;
    opacity:0;transition:opacity .8s ease 1s;
  }
  #splash.show .splash-skip{opacity:1;}
  .splash-skip:hover{color:var(--st-lamp-strong);border-color:var(--st-lamp);}
  .splash-never{
    position:absolute;left:5%;bottom:8%;z-index:4;
    font-family:var(--st-typewriter);font-size:.72rem;letter-spacing:.08em;color:#7e8aa1;
    display:flex;align-items:center;gap:.45rem;cursor:pointer;user-select:none;
    opacity:0;transition:opacity .8s ease 1.1s;
  }
  #splash.show .splash-never{opacity:1;}
  .splash-never input{accent-color:var(--st-lamp);width:14px;height:14px;}
  .splash-fallback{
    position:absolute;inset:0;z-index:2;display:none;
    align-items:center;justify-content:center;flex-direction:column;gap:1rem;
    background:radial-gradient(800px 500px at 50% 45%, rgba(232,200,122,.10), transparent 60%);
  }
  .splash-fallback .fb-lantern{
    width:90px;height:120px;border:2px solid var(--st-lamp);border-radius:14px 14px 18px 18px;
    box-shadow:0 0 40px rgba(232,200,122,.5), inset 0 0 30px rgba(232,200,122,.3);
    animation:fbpulse 2.4s ease-in-out infinite;
  }
  @keyframes fbpulse{0%,100%{box-shadow:0 0 30px rgba(232,200,122,.35), inset 0 0 22px rgba(232,200,122,.25);}50%{box-shadow:0 0 60px rgba(232,200,122,.6), inset 0 0 40px rgba(232,200,122,.45);}}
  .splash-fallback .fb-text{font-family:var(--st-typewriter);letter-spacing:.3em;color:var(--st-lamp-soft);}
  .splash-hint{
    position:absolute;left:0;right:0;top:8%;text-align:center;z-index:3;
    font-family:var(--st-typewriter);font-size:.66rem;letter-spacing:.18em;color:#67718a;
    opacity:0;transition:opacity 1s ease 1.2s;pointer-events:none;
  }
  #splash.show .splash-hint{opacity:.8;}
</style>
</head>
<body>
<div id="splash">
  <canvas id="splash-canvas"></canvas>

  <div class="splash-fallback" id="splash-fallback">
    <div class="fb-lantern"></div>
    <div class="fb-text">SLEEP·TOWN</div>
  </div>

  <div class="splash-hint">移动鼠标 · 灯光随你偏移</div>

  <div class="splash-copy">
    <div class="splash-title">SleepTown</div>
    <div class="splash-sub">深夜渔港 · 第3章 深水区</div>
    <div class="splash-tag">CASE FILE №3 · 鱼塘推理</div>
  </div>

  <button class="splash-skip" id="splash-skip">跳过 ✕</button>
  <button class="splash-enter" id="splash-enter">进入 →</button>
  <label class="splash-never">
    <input type="checkbox" id="splash-never" /> 不再自动播放
  </label>
</div>

<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js" } }
</script>

<script type="module">
import * as THREE from 'three';

const splash = document.getElementById('splash');
const canvas = document.getElementById('splash-canvas');
const fallback = document.getElementById('splash-fallback');

let renderer, scene, camera, clock;
let lanternCore, lanternLight, particles, fishes = [];
let mouse = { x: 0, y: 0 };
let parallax = { x: 0, y: 0 };
let webglOK = true;
let started = false;

try {
  renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
} catch (e) {
  webglOK = false;
}

function initThree() {
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(window.innerWidth, window.innerHeight);

  scene = new THREE.Scene();
  scene.fog = new THREE.FogExp2(0x070b14, 0.045);

  camera = new THREE.PerspectiveCamera(46, window.innerWidth / window.innerHeight, 0.1, 100);
  camera.position.set(0, 0.4, 9.2);

  // 环境补光（冷蓝，压住暗部）
  scene.add(new THREE.AmbientLight(0x223047, 0.55));
  const rim = new THREE.DirectionalLight(0x3a5a8c, 0.6);
  rim.position.set(-4, 3, -5);
  scene.add(rim);

  buildLantern();
  buildParticles();
  buildFishes();

  clock = new THREE.Clock();
  window.addEventListener('resize', onResize);
  window.addEventListener('pointermove', onPointerMove);
  animate();
}

function buildLantern() {
  const group = new THREE.Group();

  // 发光核心（光源本体）
  const coreMat = new THREE.MeshStandardMaterial({
    color: 0x2a1c08, emissive: 0xe8c87a, emissiveIntensity: 0.0,
    roughness: 0.4, metalness: 0.1
  });
  lanternCore = new THREE.Mesh(new THREE.IcosahedronGeometry(0.95, 1), coreMat);
  group.add(lanternCore);

  // 笼骨（细竖条）
  const barMat = new THREE.MeshStandardMaterial({ color: 0x0c1320, roughness: 0.6, metalness: 0.4 });
  const barCount = 6;
  for (let i = 0; i < barCount; i++) {
    const a = (i / barCount) * Math.PI * 2;
    const bar = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.05, 2.0, 6), barMat);
    bar.position.set(Math.cos(a) * 1.05, 0, Math.sin(a) * 1.05);
    group.add(bar);
  }
  // 顶盖 + 底座
  const capMat = new THREE.MeshStandardMaterial({ color: 0x101a2c, roughness: 0.5, metalness: 0.5 });
  const top = new THREE.Mesh(new THREE.ConeGeometry(1.25, 0.7, 6), capMat);
  top.position.y = 1.35; group.add(top);
  const bottom = new THREE.Mesh(new THREE.CylinderGeometry(1.15, 0.95, 0.45, 6), capMat);
  bottom.position.y = -1.25; group.add(bottom);
  // 提手
  const handle = new THREE.Mesh(new THREE.TorusGeometry(0.42, 0.07, 8, 16, Math.PI), capMat);
  handle.position.y = 1.75; group.add(handle);

  // 点光源（风灯自身发光）
  lanternLight = new THREE.PointLight(0xf5d78a, 0.0, 34, 2.0);
  group.add(lanternLight);

  group.position.y = 0.2;
  scene.add(group);
  lanternGroup = group;
}

let lanternGroup;

function buildParticles() {
  const N = 130;
  const pos = new Float32Array(N * 3);
  const vel = new Float32Array(N);
  for (let i = 0; i < N; i++) {
    const r = 1.6 + Math.random() * 4.5;
    const a = Math.random() * Math.PI * 2;
    pos[i*3]   = Math.cos(a) * r;
    pos[i*3+1] = (Math.random() - 0.5) * 9;
    pos[i*3+2] = Math.sin(a) * r - 1;
    vel[i] = 0.15 + Math.random() * 0.5;
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  const mat = new THREE.PointsMaterial({
    color: 0xf3d98c, size: 0.07, transparent: true, opacity: 0.0,
    blending: THREE.AdditiveBlending, depthWrite: false
  });
  particles = new THREE.Points(geo, mat);
  particles.userData.vel = vel;
  scene.add(particles);
}

function makeFin(mat, len, height) {
  const s = new THREE.Shape();
  s.moveTo(-len * 0.5, 0);
  s.lineTo(len * 0.5, 0);
  s.lineTo(-len * 0.1, height);
  s.closePath();
  const geo = new THREE.ExtrudeGeometry(s, { depth: 0.04, bevelEnabled: false });
  geo.translate(0, 0, -0.02);
  return new THREE.Mesh(geo, mat);
}

function makeFish() {
  const g = new THREE.Group();
  const bodyMat = new THREE.MeshStandardMaterial({ color: 0x0e1726, roughness: 0.55, metalness: 0.35 });
  const finMat  = new THREE.MeshStandardMaterial({ color: 0x0b1320, roughness: 0.7, metalness: 0.2, side: THREE.DoubleSide });
  const eyeMat  = new THREE.MeshStandardMaterial({ color: 0x05080f, emissive: 0xf5d78a, emissiveIntensity: 1.2, roughness: 0.3 });

  // 纺锤形鱼身
  const body = new THREE.Mesh(new THREE.SphereGeometry(0.5, 16, 12), bodyMat);
  body.scale.set(1.8, 0.95, 0.62);
  g.add(body);

  // 吻部
  const snout = new THREE.Mesh(new THREE.ConeGeometry(0.27, 0.55, 12), bodyMat);
  snout.rotation.z = -Math.PI / 2;
  snout.position.set(1.0, -0.02, 0);
  g.add(snout);

  // 分叉尾鳍
  const tailShape = new THREE.Shape();
  tailShape.moveTo(0, 0);
  tailShape.lineTo(-0.62, 0.5);
  tailShape.lineTo(-0.32, 0);
  tailShape.lineTo(-0.62, -0.5);
  tailShape.closePath();
  const tailGeo = new THREE.ExtrudeGeometry(tailShape, { depth: 0.05, bevelEnabled: false });
  tailGeo.translate(0, 0, -0.025);
  const tail = new THREE.Mesh(tailGeo, finMat);
  tail.position.set(-0.84, 0, 0);
  g.add(tail);

  // 背鳍
  const dorsal = makeFin(finMat, 0.6, 0.62);
  dorsal.position.set(-0.05, 0.42, 0);
  g.add(dorsal);
  // 腹鳍
  const pelvic = makeFin(finMat, 0.32, 0.34);
  pelvic.position.set(0.12, -0.4, 0);
  pelvic.rotation.z = Math.PI;
  g.add(pelvic);
  // 胸鳍（双侧）
  const pec = makeFin(finMat, 0.34, 0.38);
  pec.position.set(0.44, -0.12, 0.3);
  pec.rotation.x = Math.PI / 2.2;
  g.add(pec);
  const pec2 = pec.clone();
  pec2.position.z = -0.3;
  pec2.rotation.x = -Math.PI / 2.2;
  g.add(pec2);

  // 发光眼睛（暗夜里的两点金光）
  const eyeGeo = new THREE.SphereGeometry(0.085, 10, 10);
  const eyeL = new THREE.Mesh(eyeGeo, eyeMat); eyeL.position.set(0.68, 0.16, 0.26); g.add(eyeL);
  const eyeR = new THREE.Mesh(eyeGeo, eyeMat); eyeR.position.set(0.68, 0.16, -0.26); g.add(eyeR);

  g.userData.tail = tail;
  return g;
}

function buildFishes() {
  const specs = [
    { radius: 3.4, speed: 0.34, y: 0.6, phase: 0 },
    { radius: 4.3, speed: -0.22, y: -0.4, phase: 2.1 },
    { radius: 3.9, speed: 0.27, y: 1.1, phase: 4.0 }
  ];
  specs.forEach(s => {
    const f = makeFish();
    f.userData = s;
    scene.add(f);
    fishes.push(f);
  });
}

function onResize() {
  if (!webglOK) return;
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
}

function onPointerMove(e) {
  const t = (e.touches && e.touches[0]) || e;
  mouse.x = (t.clientX / window.innerWidth) * 2 - 1;
  mouse.y = (t.clientY / window.innerHeight) * 2 - 1;
}

function animate() {
  requestAnimationFrame(animate);
  if (document.hidden) return; // 标签页隐藏即暂停
  const t = clock.getElapsedTime();
  const dt = clock.getDelta();

  // 进场：0~1.4s 点亮
  const lit = Math.min(t / 1.4, 1);
  const ease = lit * lit * (3 - 2 * lit);
  lanternCore.material.emissiveIntensity = 1.6 * ease;
  lanternLight.intensity = 2.6 * ease;
  lanternGroup.rotation.y = t * 0.25;
  lanternGroup.position.y = 0.2 + Math.sin(t * 0.8) * 0.12;

  // 粒子上浮
  const arr = particles.geometry.attributes.position.array;
  const vel = particles.userData.vel;
  for (let i = 0; i < vel.length; i++) {
    arr[i*3+1] += vel[i] * dt;
    if (arr[i*3+1] > 5) arr[i*3+1] = -5;
  }
  particles.geometry.attributes.position.needsUpdate = true;
  particles.material.opacity = 0.85 * ease;

  // 鱼影环绕
  fishes.forEach(f => {
    const u = f.userData;
    const a = u.phase + t * u.speed;
    f.position.set(Math.cos(a) * u.radius, u.y + Math.sin(t * 0.6 + u.phase) * 0.3, Math.sin(a) * u.radius - 1);
    f.rotation.y = -a + Math.PI / 2;
    f.rotation.z = Math.sin(t + u.phase) * 0.15;
    if (f.userData.tail) f.userData.tail.rotation.y = Math.sin(t * 5 + u.phase) * 0.5; // 尾鳍摆动
  });

  // 鼠标视差（相机 + 灯光偏移）
  parallax.x += (mouse.x - parallax.x) * 0.05;
  parallax.y += (mouse.y - parallax.y) * 0.05;
  camera.position.x = parallax.x * 1.3;
  camera.position.y = 0.4 - parallax.y * 0.9;
  camera.lookAt(0, 0.2, 0);
  if (lanternLight) lanternLight.position.x = parallax.x * 1.5;

  renderer.render(scene, camera);
}

function start() {
  if (started) return;
  started = true;
  window.__SPLASH_STARTED = true;
  if (!webglOK) {
    fallback.style.display = 'flex';
    splash.classList.add('show');
    return;
  }
  initThree();
  splash.classList.add('show');
}

function dismiss() {
  splash.classList.add('gone');
  setTimeout(() => { splash.style.display = 'none'; }, 950);
}

document.getElementById('splash-enter').addEventListener('click', dismiss);
document.getElementById('splash-skip').addEventListener('click', dismiss);
document.getElementById('splash-never').addEventListener('change', (e) => {
  // 原型中仅回显；并入真实文件时会写入 localStorage
  console.log('不再自动播放 =', e.target.checked);
});

// 安全兜底：若 3 秒内 Three.js(CDN) 仍未加载，显示降级版
const safety = setTimeout(() => {
  if (!started && webglOK) {
    // 仅当模块脚本未执行时才降级（模块加载失败）
  }
}, 3000);

start();
</script>

<script>
  // 安全网：若 ES 模块(CDN Three.js)加载失败，4s 后显示 CSS 降级版，避免黑屏
  window.addEventListener('load', function () {
    setTimeout(function () {
      if (!window.__SPLASH_STARTED) {
        var fb = document.getElementById('splash-fallback');
        var sp = document.getElementById('splash');
        if (fb) fb.style.display = 'flex';
        if (sp) sp.classList.add('show');
      }
    }, 4000);
  });
</script>
</body>
</html>
