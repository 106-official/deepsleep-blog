<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Lixin</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=VT323&family=ZCOOL+KuaiLe&display=swap" rel="stylesheet" />
<style>
  :root{
    --grass:#7cb86a; --grass2:#74b062; --dirt:#caa472; --dirt2:#bd9663;
    --wood:#8a5a3b; --wood-d:#6e452c; --water:#6db8e0; --water-d:#4f9fd0;
    --ink:#3a2f25; --paper:#fff7e6; --paper-d:#f0e2c4;
    --brand:#d98a1f; --brand-d:#b9700f;
    --panel:#fffaf0; --shadow:rgba(60,40,20,.25);
    --ok:#2f9e6b; --bad:#d4564b;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;height:100%;}
  body{
    font-family:'ZCOOL KuaiLe','PingFang SC','Microsoft YaHei',system-ui,sans-serif;
    background:radial-gradient(circle at 50% 0%, #bfe6a8, #9ed188 60%, #8cc778);
    color:var(--ink); overflow:hidden; user-select:none;
  }
  .wrap{position:fixed;inset:0;display:flex;flex-direction:column;}
  /* 顶部 HUD */
  .hud{
    display:flex;align-items:center;gap:12px;padding:10px 16px;
    background:linear-gradient(180deg,rgba(255,250,240,.95),rgba(255,250,240,.7));
    border-bottom:3px solid var(--wood); box-shadow:0 3px 10px var(--shadow); z-index:5;
    flex-wrap:nowrap; white-space:nowrap;
  }
  .hud h1{font-size:22px;margin:0;color:var(--wood-d);letter-spacing:1px;
    text-shadow:1px 1px 0 #fff;}
  .hud .hint{font-size:13px;color:#6b5a44;opacity:.85;overflow:hidden;text-overflow:ellipsis;}
  .hud .spacer{flex:1;}
  .btn{
    font-family:inherit;cursor:pointer;border:none;border-radius:999px;
    padding:8px 16px;font-size:15px;background:var(--brand);color:#fff;
    box-shadow:0 3px 0 var(--brand-d);transition:transform .08s, box-shadow .08s;
  }
  .btn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--brand-d);}
  .btn.ghost{background:#fff;color:var(--wood-d);box-shadow:0 3px 0 #d9c7a3;}
  .btn.sm{padding:6px 12px;font-size:13px;}
  /* 地图区 */
  .stage{flex:1;position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden;min-height:0;}
  canvas{image-rendering:pixelated;background:#7cb86a;border-radius:14px;
    box-shadow:0 10px 30px var(--shadow), inset 0 0 0 4px var(--wood);
    width:100%;height:100%;touch-action:none;display:block;}
  /* 村民图鉴弹窗 */
  .codex{position:absolute;inset:0;display:none;align-items:center;justify-content:center;
    background:rgba(40,30,20,.45);z-index:12;padding:16px;}
  .codex.show{display:flex;}
  .codex-inner{position:relative;background:var(--panel);border:4px solid var(--wood);
    border-radius:16px;width:min(780px,96vw);max-height:88%;overflow:auto;padding:18px;
    box-shadow:0 14px 34px var(--shadow);}
  .codex h3{margin:0 0 12px;font-size:20px;color:var(--wood-d);}
  .codex .close{position:absolute;right:10px;top:10px;cursor:pointer;font-size:20px;color:#9a8a6a;
    width:30px;height:30px;display:flex;align-items:center;justify-content:center;border-radius:50%;}
  .codex .close:hover{background:var(--paper-d);}
  .codex-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px;}
  .ccard{border:2px solid var(--wood);border-radius:12px;padding:10px;background:var(--paper);
    display:flex;flex-direction:column;}
  .ccard .top{display:flex;gap:10px;align-items:center;}
  .ccard .p{width:50px;height:50px;border-radius:10px;flex:none;display:flex;align-items:center;
    justify-content:center;font-size:28px;border:2px solid var(--wood-d);}
  .ccard .nm{font-size:17px;color:var(--wood-d);margin:0;}
  .ccard .tt{font-size:12px;color:#8a7355;margin-top:1px;}
  .ccard .intro{font-size:13px;line-height:1.6;color:var(--ink);margin-top:8px;flex:1;}
  .ccard .bdr{font-size:12px;color:var(--brand-d);margin-top:6px;background:var(--paper-d);
    border-radius:8px;padding:6px 8px;line-height:1.5;}
  .ccard .go{margin-top:10px;}
  /* 对话面板 */
  .dialog{
    position:absolute;left:50%;bottom:18px;transform:translateX(-50%) translateY(140%);
    width:min(680px,94vw);background:var(--panel);border:4px solid var(--wood);
    border-radius:16px;box-shadow:0 12px 30px var(--shadow);padding:14px;z-index:8;
    transition:transform .25s cubic-bezier(.2,.9,.3,1.2);
  }
  .dialog.show{transform:translateX(-50%) translateY(0);}
  .dlg-top{display:flex;gap:12px;align-items:flex-start;}
  .portrait{width:64px;height:64px;border-radius:12px;flex:none;border:3px solid var(--wood-d);
    display:flex;align-items:center;justify-content:center;font-size:34px;background:#ffe;}
  .dlg-name{font-size:18px;color:var(--wood-d);margin:0 0 2px;}
  .dlg-title{font-size:12px;color:#8a7355;}
  .dlg-text{margin:8px 2px 4px;font-size:16px;line-height:1.6;min-height:48px;
    background:var(--paper);border-radius:10px;padding:8px 10px;border:1px solid var(--paper-d);}
  .dlg-text .cur{color:var(--brand-d);font-weight:bold;}
  .choices{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px;}
  .chat{margin-top:8px;display:flex;flex-direction:column;gap:6px;max-height:150px;overflow:auto;}
  .bubble{max-width:85%;padding:7px 11px;border-radius:12px;font-size:15px;line-height:1.5;}
  .bubble.me{align-self:flex-end;background:var(--brand);color:#fff;border-bottom-right-radius:3px;}
  .bubble.npc{align-self:flex-start;background:var(--paper);border:1px solid var(--paper-d);border-bottom-left-radius:3px;}
  .input-row{display:flex;gap:8px;margin-top:8px;}
  .input-row input{flex:1;font-family:inherit;font-size:15px;padding:9px 12px;border-radius:10px;
    border:2px solid var(--wood);background:#fff;color:var(--ink);outline:none;min-width:0;}
  .input-row input:focus{border-color:var(--brand);}
  .score{font-size:13px;color:var(--brand-d);margin-top:4px;}
  /* 设置面板 */
  .settings{position:absolute;right:14px;top:14px;background:rgba(255,250,240,.96);
    border:3px solid var(--wood);border-radius:14px;padding:12px;width:min(280px,84vw);z-index:9;
    box-shadow:0 8px 20px var(--shadow);display:none;}
  .settings.show{display:block;}
  .settings h3{margin:0 0 8px;font-size:16px;color:var(--wood-d);}
  .settings label{font-size:12px;color:#6b5a44;display:block;margin:8px 0 3px;}
  .settings input{width:100%;font-family:inherit;font-size:13px;padding:7px 9px;border-radius:8px;
    border:2px solid var(--wood);background:#fff;outline:none;}
  .settings .mode{font-size:12px;color:#6b5a44;margin-top:8px;line-height:1.5;}
  .settings .close{position:absolute;right:8px;top:6px;cursor:pointer;font-size:18px;color:#9a8a6a;}
  /* 更新日志面板（右上角） */
  .changelog{position:absolute;right:14px;top:14px;background:rgba(255,250,240,.97);
    border:3px solid var(--wood);border-radius:14px;padding:12px 14px;width:min(340px,92vw);max-height:74%;
    overflow:auto;z-index:9;box-shadow:0 8px 20px var(--shadow);display:none;}
  .changelog.show{display:block;}
  .changelog h3{margin:0 0 6px;font-size:16px;color:var(--wood-d);}
  .changelog .close{position:absolute;right:8px;top:6px;cursor:pointer;font-size:18px;color:#9a8a6a;
    width:28px;height:28px;display:flex;align-items:center;justify-content:center;border-radius:50%;}
  .changelog .close:hover{background:var(--paper-d);}
  .changelog .ver{font-size:14px;color:var(--brand-d);font-weight:bold;margin:10px 0 3px;
    border-bottom:2px solid var(--paper-d);padding-bottom:3px;}
  .changelog .ver:first-of-type{margin-top:2px;}
  .changelog .date{font-size:11px;color:#9a8a6a;font-weight:normal;margin-left:6px;}
  .changelog ul{margin:4px 0 6px;padding-left:18px;}
  .changelog li{font-size:12.5px;color:var(--ink);line-height:1.6;margin:3px 0;}
  .toast{position:absolute;left:50%;top:14px;transform:translateX(-50%);
    background:rgba(58,47,37,.92);color:#fff;padding:8px 16px;border-radius:999px;font-size:14px;
    z-index:20;opacity:0;transition:opacity .3s;pointer-events:none;}
  .toast.show{opacity:1;}
  .near-tip{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);
    background:rgba(255,250,240,.95);border:2px solid var(--brand);border-radius:999px;
    padding:6px 16px;font-size:14px;color:var(--wood-d);z-index:6;display:none;}
  .near-tip.show{display:block;animation:bob 1s infinite ease-in-out;}
  @keyframes bob{50%{transform:translateX(-50%) translateY(-4px);}}
  /* 熟悉度标签 */
  .familiarity{font-size:13px;color:var(--brand-d);background:var(--paper);border:1.5px solid var(--brand);
    border-radius:999px;padding:3px 12px;letter-spacing:0.5px;}
  .familiarity b{color:var(--brand-d);font-weight:bold;font-size:14px;}
  /* ============ 手机端适配（紧凑 HUD，让画面最大化） ============ */
  @media (max-width:720px){
    .hud{padding:5px 8px;gap:5px;}
    .hud h1{font-size:15px;letter-spacing:0;}
    .hud .hint{display:none;}
    .hud .spacer{flex:0;}
    .btn{padding:5px 8px;font-size:12px;}
    .btn.sm{padding:4px 7px;font-size:11px;}
    .btn .lbl{display:none;}            /* 按钮只留图标 */
    .familiarity{font-size:11px;padding:2px 7px;}
    .familiarity b{font-size:12px;}
    .stage{padding:3px;}
    canvas{border-radius:10px;box-shadow:0 6px 18px var(--shadow), inset 0 0 0 3px var(--wood);}
    .dialog{bottom:8px;padding:10px;border-width:3px;}
    .dlg-text{font-size:15px;min-height:40px;}
    .bubble{font-size:14px;}
    .portrait{width:52px;height:52px;font-size:28px;}
    .near-tip{font-size:12px;padding:4px 12px;bottom:8px;}
    .changelog{right:6px;top:6px;width:92vw;max-height:80%;}
    .settings{right:6px;top:6px;width:84vw;}
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="hud">
    <h1>🌾 Lixin</h1>
    <span class="hint">点地面走动 · 点学长问全站 · 点村民聊单科 · 低头迅速走开摆脱校园搭讪</span>
    <span class="familiarity">熟悉度：<b id="famVal">0</b></span>
    <span class="spacer"></span>
    <button class="btn ghost sm" id="codexBtn">📖<span class="lbl"> 村民图鉴</span></button>
    <button class="btn ghost sm" id="helpBtn">❓<span class="lbl"> 玩法</span></button>
    <button class="btn ghost sm" id="logBtn">📜<span class="lbl"> 更新日志</span></button>
    <button class="btn ghost sm" id="setBtn">⚙<span class="lbl"> 设置</span></button>
  </div>

  <div class="stage" id="stage">
    <canvas id="game"></canvas>
    <div class="near-tip" id="nearTip">按 <b>空格</b> 或点击村民对话</div>

    <div class="dialog" id="dialog">
      <div class="dlg-top">
        <div class="portrait" id="dlgPortrait">🧑‍🏫</div>
        <div>
          <p class="dlg-name" id="dlgName">村民</p>
          <div class="dlg-title" id="dlgTitle"></div>
        </div>
      </div>
      <div class="dlg-text" id="dlgText"></div>
      <div class="choices" id="choices"></div>
      <div class="chat" id="chat" style="display:none"></div>
      <div class="input-row" id="inputRow" style="display:none">
        <input id="chatInput" placeholder="说点什么…（Enter 发送）" autocomplete="off" />
        <button class="btn sm" id="sendBtn">发送</button>
      </div>
      <div class="score" id="score" style="display:none"></div>
    </div>

    <div class="settings" id="settings">
      <span class="close" id="setClose">✕</span>
      <h3>⚙ LLM 设置</h3>
      <label>后端地址（留空则用内置 Demo）</label>
      <input id="cfgBackend" placeholder="https://你的后端/api" />
      <label>模型名（可选）</label>
      <input id="cfgModel" placeholder="gpt-4o-mini / deepseek-chat …" />
      <div class="mode" id="cfgMode">当前模式：<b>内置 Demo</b><br>
        配置后端并部署 <code>/api/llm/chat</code> 后，对话会走真实大模型。密钥放在后端环境变量，绝不进前端。</div>
      <button class="btn sm" id="cfgSave" style="margin-top:10px;width:100%">保存</button>
    </div>

    <div class="changelog" id="changelog">
      <span class="close" id="logClose">✕</span>
      <h3>📜 更新日志</h3>
      <div id="logBody"></div>
      <button class="btn sm" id="logCloseBtn" style="width:100%;margin-top:10px;">关闭</button>
    </div>

    <div class="codex" id="codex">
      <div class="codex-inner">
        <span class="close" id="codexClose">✕</span>
        <h3>📖 村民图鉴</h3>
        <div class="codex-grid" id="codexGrid"></div>
      </div>
    </div>

    <div class="toast" id="toast"></div>
    <div id="errBar" style="position:absolute;left:50%;bottom:50px;transform:translateX(-50%);z-index:99;background:rgba(212,86,75,.95);color:#fff;padding:6px 14px;border-radius:8px;font:12px/1.4 monospace;max-width:90%;display:none;cursor:pointer;white-space:pre-wrap;"></div>
  </div>
</div>

<script>
/* ============================================================
   Lixin · 学习 RPG  v1.5
   - 地图扩大 4 倍（176×132，楼间距拉大，便于后续细化）
   - 引入 Kenney Tiny Town（CC0）素材：草地/泥路/树/灌木/花/桥
   - 文汇路小吃街（摊位 + 路灯 + 招牌）
   - 小坏人可见化（地图上渲染形象 + 名牌）
   - 手机端适配（紧凑 HUD + 动态逻辑分辨率）
   - 修复：路灯不再落在路中央 / 道路不再与河流重叠
   ============================================================ */
(function(){
  var bar=document.getElementById('errBar');
  if(!bar) return;
  bar.title='点击关闭';
  bar.onclick=function(){bar.style.display='none';};
  function show(msg){ bar.textContent='⚠ '+msg; bar.style.display='block'; }
  window.addEventListener('error',function(e){show((e.message||e)+' ('+(e.filename||'')+':'+(e.lineno||'')+')');});
  window.addEventListener('unhandledrejection',function(e){show('Promise: '+(e.reason&&e.reason.message||e.reason));});
  window.__showErr=show;
})();

/* ---------- 学科 / NPC 数据 ---------- */
const LIXIN_KB = `「立信学习」（Lixin Learn）是上海立信会计金融学院的课程资料与历年真题互动学习平台，由松江（文翔路2800号，主校区）与浦东（上川路995号）两个校区组成。站点用 Hugo + PaperMod 构建，公式用 KaTeX 渲染、表格用 Markdown、扫描件/真题以图片化方式保真嵌入。共 6 大课程板块：
1. 会计学原理（基础会计）：按「知识点(8章)→选择题→判断题→业务题(分录/试算平衡/平行登记)」组织，含 T 型账户、扫描 PDF/Word/真题图。
2. 微积分（一）（高数上）：函数极限、导数微分、中值定理、不定积分、定积分、定积分应用；知识点框架 + 2015–2016 至 2024–2025 十年期末真题（图片化）。
3. 微积分（二）（高数下）：定积分、常微分方程、多元函数微分学、二重积分、无穷级数；知识点(LaTeX)+习题套卷+历年真题。
4. 线性代数：行列式、线性方程组等讲义截图；22/23级阶段与期中测验；历年试卷 2017–2025 及 2004–2016 历年试题(PDF/DOC)。
5. 概率论与数理统计（经管）：按题型(选择/填空/计算/应用)归类 2016–2021 七套卷；2022-2023/2023-2024/2024-2025 三套完整卷；公式 LaTeX。
6. Python 程序设计基础：语法/数据类型/流程控制/组合数据类型；单选题/判断题/编程题/扫描讲义；含闯关训练、阶段/期中/期末。
站点还内置一个星露谷风格的 RPG 小游戏（Lixin）：点地面让小人走动、点村民对话，每位村民对应一门课，对话可选「💬自由问答」或「🔥Grill me 摸底」（村民先划清知识边界再逐题考你）。`;

const NPCS = [
  {
    id:'senpai', name:'学长', title:'立信向导 · 学长', emoji:'🎓', color:'#3b7fd4',
    tile:{x:24,y:99}, greeting:'嗨，学弟/学妹！我是学长，立信的活地图～想了解「立信学习」站点、各门课怎么刷、文翔路/上川路两校区在哪儿，尽管问我！',
    scope:'「立信学习」全站内容与上海立信会计金融学院两校区公开信息（课程板块、历年真题、备考路径）。',
    out:'不逐题讲具体某门课（请找对应村民），也不编造站点里没有的资料或题目。',
    quiz:[
      {q:'「立信学习」站点里共有几个课程板块？分别是什么？',
       a:'6 个：会计学原理、微积分（一）、微积分（二）、线性代数、概率论与数理统计、Python 程序设计基础。'},
      {q:'学校有几个校区？分别在哪？',
       a:'两个：松江校区（文翔路2800号，主校区）和浦东校区（上川路995号）。'},
      {q:'想在站点里刷历年真题，该进哪个栏目？',
       a:'各课程板块的「历年真题」栏目，如微积分（一）有 2015–2025 十年期末卷，概率论有近年完整卷。'}
    ]
  },
  {
    id:'accounting', name:'会计学NPC', title:'会计学助教', emoji:'🧮', color:'#c97b5a',
    tile:{x:16,y:84}, greeting:'哟，新同学！我是会计学NPC，Lixin 会计学的助教～',
    scope:'会计恒等式、借贷记账法、分录、账簿、三大报表（资产/利润/现金流）。',
    out:'不聊与会计无关的（编程、其他学科），也不给具体税务/审计的法律意见。',
    quiz:[
      {q:'会计恒等式是什么？为什么“有借必有贷，借贷必相等”？',
       a:'资产 = 负债 + 所有者权益；每笔业务至少影响两个账户且金额相等。'},
      {q:'计提折旧会影响哪些报表项目？',
       a:'利润表（折旧费用）与资产负债表（累计折旧、资产净值）。'},
      {q:'权责发生制和收付实现制有什么区别？',
       a:'前者按权利责任发生确认，后者按现金收付确认。'}
    ]
  },
  {
    id:'calc1', name:'微积分一NPC', title:'微积分（一）学姐', emoji:'📐', color:'#5a8fc9',
    tile:{x:8,y:60}, greeting:'极限和导数还晕吗？我是微积分一NPC，微积分一包教包会～',
    scope:'极限与连续、导数与微分、中值定理、不定积分、洛必达法则。',
    out:'定积分 / 级数 / 多元微积分归微积分二，别来问我哦。',
    quiz:[
      {q:'导数 f′(x) 的几何意义是什么？', a:'函数图像在该点的切线斜率。'},
      {q:'用洛必达法则求 lim(x→0) sinx/x。', a:'分子分母同求导得 cosx/1，代入 0 得 1。'},
      {q:'拉格朗日中值定理说明了什么？', a:'开区间内存在一点，其切线平行于两端割线。'}
    ]
  },
  {

function buildBlocked(){
  blocked.clear();
  BUILDINGS.forEach(b=>{for(let i=b.x;i<b.x+b.w;i++)for(let j=b.y;j<b.y+b.h;j++)blocked.add(key(i,j));});

    if(LAKE_BRIDGES&&LAKE_BRIDGES.some(b=>i>=b.x&&i<b.x+b.w&&j>=b.y&&j<b.y+b.h))continue;
    blocked.add(key(i,j));
  }});
  WALLS.forEach(w=>{for(let i=w.x;i<w.x+w.w;i++)for(let j=w.y;j<w.y+w.h;j++)blocked.add(key(i,j));});
}

let FIREFLIES=[], SQUIRRELS=[], FROGS=[], CATS=[];
function rndTile(){ return {x:Math.floor(rnd()*COLS), y:Math.floor(rnd()*ROWS)}; }
function randGrassTile(){ for(let i=0;i<40;i++){ const t=rndTile(); if(passable(t.x*TILE+TILE/2,t.y*TILE+TILE/2)&&!isPath(t.x,t.y)) return t; } return {x:40,y:60}; }
function randAnyTile(){ for(let i=0;i<40;i++){ const t=rndTile(); if(passable(t.x*TILE+TILE/2,t.y*TILE+TILE/2)) return t; } return {x:40,y:60}; }
function lakeSideTile(){
  const lake=LAKE[Math.floor(rnd()*LAKE.length)];
  for(let i=0;i<24;i++){
    const lx=lake.x+Math.floor(rnd()*lake.w);
    const ly=lake.y+(rnd()<0.5?-1:2);
    if(passable(lx*TILE+TILE/2,ly*TILE+TILE/2)) return {x:lx,y:ly};
  }
  return {x:lake.x+2,y:lake.y-1};
}
function spawnAnimals(){
  FIREFLIES=[];
  for(let i=0;i<22;i++){ const t=randGrassTile(); const hx=t.x*TILE+TILE/2, hy=t.y*TILE+TILE/2;
    FIREFLIES.push({hx,hy,x:hx,y:hy,ph:rnd()*6.28,sp:0.4+rnd()*0.5,r:16+rnd()*22}); }
  SQUIRRELS=[];
  for(let i=0;i<7;i++){ const t=randGrassTile(); SQUIRRELS.push({x:t.x*TILE+TILE/2,y:t.y*TILE+TILE/2,tx:t.x*TILE+TILE/2,ty:t.y*TILE+TILE/2,dir:1,walk:0,frame:0,ft:0}); }
  FROGS=[];
  for(let i=0;i<8;i++){ const t=lakeSideTile(); FROGS.push({x:t.x*TILE+TILE/2,y:t.y*TILE+TILE/2,frame:Math.floor(rnd()*12),ft:rnd()*10,hop:rnd()*200}); }
  CATS=[];
  for(let i=0;i<20;i++){ const t=randAnyTile(); CATS.push({x:t.x*TILE+TILE/2,y:t.y*TILE+TILE/2,tx:t.x*TILE+TILE/2,ty:t.y*TILE+TILE/2,dir:1,walk:0,blinkPhase:rnd()*4}); }
}
function stepAnimal(a,sp,dt){
  const dx=a.tx-a.x, dy=a.ty-a.y, d=Math.hypot(dx,dy);
  if(d<2){ const t=randAnyTile(); a.tx=t.x*TILE+TILE/2; a.ty=t.y*TILE+TILE/2; }
  else { if(dx)a.dir=dx>0?1:-1; const mv=sp*dt; a.x+=dx/d*Math.min(mv,d); a.y+=dy/d*Math.min(mv,d); a.walk+=0.3*dt; }
}
function updateAnimals(dt){
  FIREFLIES.forEach(f=>{ f.ph+=f.sp*dt*0.05; f.x=f.hx+Math.cos(f.ph)*f.r; f.y=f.hy+Math.sin(f.ph*1.3)*f.r*0.7; });
  SQUIRRELS.forEach(s=>{
    stepAnimal(s,1.4,dt); s.ft+=dt;
    const moving=Math.hypot(s.tx-s.x,s.ty-s.y)>=2;
    const fps=moving?0.5:0.32;
    if(s.ft>=fps){ s.ft=0; s.frame=(s.frame+1)%(moving?8:6); }
  });
  CATS.forEach(c=>{ stepAnimal(c,1.0,dt); c.blinkPhase+=dt; });
  FROGS.forEach(fr=>{
    fr.ft+=dt; if(fr.ft>=0.16){ fr.ft=0; fr.frame=(fr.frame+1)%12; }
    fr.hop-=dt; if(fr.hop<=0){ fr.hop=120+rnd()*220; const dir=rnd()<0.5?-1:1; if(passable(fr.x+dir*TILE,fr.y)) fr.x+=dir*TILE; }
  });
}
function drawFirefly(f){

  if(im&&im.complete&&im.naturalWidth){ const s=18; ctx.drawImage(im,f.x-s/2,f.y-s/2,s,s); }

  ctx.restore();
}
function drawSquirrel(s){
  const moving=Math.hypot(s.tx-s.x,s.ty-s.y)>=2;
  const key=moving?('squirrel_run_'+(s.frame+1)):('squirrel_idle_'+(s.frame+1));

}

}
function drawCat(c){

      else{s.phase='run';s.phaseTime=20+Math.random()*40;}

      s.y+=dy/dist*Math.min(sp*dt,dist);
      s.walk+=0.3*dt*(sp/s.speed);
    }else s.walk=0;
  });
}

function kTile(name,dx,dy,dw,dh){
  if(!kReady)return;
  const i=KENNEY_COL[name];

}

let LOGIC_W=960, LOGIC_H=672;
const DPR=Math.min(1.5,window.devicePixelRatio||1);
let cv=document.getElementById('game'), ctx=cv.getContext('2d');
let cacheCv=document.createElement('canvas'), cacheCtx=cacheCv.getContext('2d');

function resizeCanvas(){
  const st=document.getElementById('stage');
  const r=st.getBoundingClientRect();
  LOGIC_W=Math.max(280,Math.floor(r.width));
  LOGIC_H=Math.max(200,Math.floor(r.height));
  cv.width=LOGIC_W*DPR; cv.height=LOGIC_H*DPR;
  ctx.setTransform(DPR,0,0,DPR,0,0);
  invalidateCache();
}
window.addEventListener('resize',resizeCanvas);
resizeCanvas();

function shade(hex,amt){
  const c=hex.replace('#','');let r=parseInt(c.substr(0,2),16),g=parseInt(c.substr(2,2),16),b=parseInt(c.substr(4,2),16);
  r=Math.max(0,Math.min(255,r+amt));g=Math.max(0,Math.min(255,g+amt));b=Math.max(0,Math.min(255,b+amt));
  return 'rgb('+r+','+g+','+b+')';
}
/* ---- 草地 / 道路 tile（Kenney 素材，带少量花） ---- */
function drawGrassTile(x,y){
  const h=(x*7+y*13)%11;
  let name='grassA';
  if(h===0)name='grassB'; else if(h===3)name='grassAf'; else if(h===7)name='grassBf';
  kTile(name,x*TILE,y*TILE);
}
function drawPathTile(x,y,p){
  const px=x*TILE, py=y*TILE, type=p.type||'path';
  if(type==='road'){
    // 沥青马路：深灰底 + 细微噪点
    ctx.fillStyle='#3b3f45'; ctx.fillRect(px,py,TILE,TILE);
    const hsh=(x*13+y*7)%5;
    ctx.fillStyle='rgba(255,255,255,.05)'; if(hsh===0)ctx.fillRect(px+5,py+7,3,3);
    ctx.fillStyle='rgba(0,0,0,.12)'; if(hsh===2)ctx.fillRect(px+18,py+20,4,3);
    ctx.fillStyle='rgba(255,255,255,.04)'; if(hsh===4)ctx.fillRect(px+10,py+22,2,2);
    // 车道中线（宽路中间一行画淡黄虚线）
    ctx.strokeStyle='rgba(240,210,90,.75)'; ctx.lineWidth=2; ctx.setLineDash([6,6]);
    if(p.w>=p.h && y===p.y+((p.h/2)|0)){ ctx.beginPath(); ctx.moveTo(px,py+TILE/2); ctx.lineTo(px+TILE,py+TILE/2); ctx.stroke(); }
    if(p.w<p.h && x===p.x+((p.w/2)|0)){ ctx.beginPath(); ctx.moveTo(px+TILE/2,py); ctx.lineTo(px+TILE/2,py+TILE); ctx.stroke(); }
    ctx.setLineDash([]);
    return;
  }
  if(type==='cobble'){
    // 鹅卵石道路：青灰底 + 圆石拼贴（河边用）
    ctx.fillStyle='#8d8a82'; ctx.fillRect(px,py,TILE,TILE);
    const off=((x+y)%2)*6;
    for(let cy=0;cy<2;cy++)for(let cx=0;cx<2;cx++){
      const ox=px+cx*16+(cy%2?8:0), oy=py+cy*16+(off%8);
      ctx.fillStyle='#a7a39a'; ctx.beginPath(); ctx.ellipse(ox+8,oy+8,7,6,0,0,Math.PI*2); ctx.fill();
      ctx.strokeStyle='rgba(70,66,60,.35)'; ctx.lineWidth=1; ctx.beginPath(); ctx.ellipse(ox+8,oy+8,7,6,0,0,Math.PI*2); ctx.stroke();
    }
    return;
  }
  // 土路（默认）：Kenney dirtA
  kTile('dirtA',px,py);
}
function drawRoof(b,x,y,w,h){
  const rh=Math.max(14,Math.min(26,h*0.5));
  const dark=shade(b.color,-34), mid=shade(b.color,-14);
  if(b.type==='gym'){
    ctx.fillStyle=dark;ctx.beginPath();ctx.moveTo(x-3,y);ctx.lineTo(x+w+3,y);
    ctx.quadraticCurveTo(x+w/2,y-rh-12,x-3,y);ctx.closePath();ctx.fill();
    ctx.fillStyle=mid;ctx.fillRect(x-3,y-3,w+6,5);return;
  }
  ctx.fillStyle=dark;ctx.beginPath();ctx.moveTo(x-4,y);ctx.lineTo(x+w/2,y-rh);ctx.lineTo(x+w+4,y);ctx.closePath();ctx.fill();
  ctx.fillStyle=mid;ctx.beginPath();ctx.moveTo(x-4,y);ctx.lineTo(x+w/2,y-rh);ctx.lineTo(x+w/2,y-rh+5);ctx.lineTo(x-2,y);ctx.closePath();ctx.fill();
  if(b.type==='landmark'){
    const cx=x+w/2, cy=y-rh-14;
    ctx.fillStyle='#8a5a3b';ctx.fillRect(cx-6,cy,12,16);
    ctx.fillStyle='#f3d27a';ctx.beginPath();ctx.arc(cx,cy+7,6,0,7);ctx.fill();
    ctx.strokeStyle='#6e452c';ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(cx,cy+2);ctx.lineTo(cx,cy+12);ctx.moveTo(cx-5,cy+7);ctx.lineTo(cx+5,cy+7);ctx.stroke();
    ctx.fillStyle='#d9b24a';ctx.fillRect(x-4,y-rh-2,w+8,4);
  }
  if(b.type==='library'){
    ctx.fillStyle='#efe2c4';
    const step=Math.max(14,(w-16)/4);
    for(let i=x+8;i<x+w-8;i+=step)ctx.fillRect(i,y+h-8,7,h+8);
  }
}
function drawWindows(b,x,y,w,h){
  const wy0=y+10;
  for(let wy=wy0;wy<y+h-22;wy+=16)for(let wx=x+9;wx<x+w-12;wx+=18){
    ctx.fillStyle='#fff3c4';ctx.fillRect(wx,wy,11,12);
    ctx.strokeStyle='rgba(90,60,40,.55)';ctx.lineWidth=1;ctx.strokeRect(wx,wy,11,12);
    ctx.beginPath();ctx.moveTo(wx+5.5,wy);ctx.lineTo(wx+5.5,wy+12);ctx.stroke();
  }
}

function drawBuilding(b){
  const x=b.x*TILE,y=b.y*TILE,w=b.w*TILE,h=b.h*TILE;
  ctx.fillStyle='rgba(0,0,0,.18)';ctx.fillRect(x+5,y+h-2,w,10);

function drawLake(p){
  const x=p.x*TILE,y=p.y*TILE,w=p.w*TILE,h=p.h*TILE;
  ctx.fillStyle='#2e6f9e';ctx.fillRect(x,y,w,h);
  const g=ctx.createLinearGradient(x,y,x,y+h);
  g.addColorStop(0,'#4f9fd0');g.addColorStop(.5,'#3f86c0');g.addColorStop(1,'#2e6f9e');
  ctx.fillStyle=g;ctx.fillRect(x,y,w,h);
  // 岸边浅滩（草色过渡）
  ctx.fillStyle='rgba(126,176,120,.55)';ctx.fillRect(x,y-2,w,3);ctx.fillRect(x,y+h-1,w,3);
  // 静态波纹细线
  ctx.strokeStyle='rgba(255,255,255,.15)';ctx.lineWidth=1.2;
  for(let i=0;i<5;i++){
    const wy=y+2+i*3;
    ctx.beginPath();ctx.moveTo(x+2,wy);ctx.quadraticCurveTo(x+w/2,wy-2,x+w-2,wy);ctx.stroke();
  }
}
function drawPond(p){drawLake(p);}

function drawLamp(l){
  // 地面投射渐变光效（程序化）
  ctx.save(); ctx.translate(l.x,l.y+10); ctx.scale(1.6,0.8);
  const g=ctx.createRadialGradient(0,0,2,0,0,26);
  g.addColorStop(0,'rgba(255,222,150,.50)');
  g.addColorStop(.6,'rgba(255,222,150,.18)');
  g.addColorStop(1,'rgba(255,222,150,0)');
  ctx.fillStyle=g; ctx.beginPath(); ctx.arc(0,0,26,0,7); ctx.fill();
  ctx.restore();
  // 素材光晕（RPicster glow，CC0）：地面暖光叠加
  if(A.glow_spotlight_1&&A.glow_spotlight_1.complete&&A.glow_spotlight_1.naturalWidth){
    ctx.save(); ctx.globalCompositeOperation='lighter'; ctx.globalAlpha=0.5;
    const s=l.big?130:95;
    ctx.drawImage(A.glow_spotlight_1, l.x-s/2, l.y+10-s/2, s, s);
    ctx.restore();
  }
  // 灯柱投影
  ctx.fillStyle='rgba(0,0,0,.15)';
  ctx.beginPath(); ctx.ellipse(l.x+7,l.y+17,9,2.4,0,0,Math.PI*2); ctx.fill();
  // 底座
  ctx.fillStyle='#4a3526';ctx.fillRect(l.x-6,l.y+13,12,5);
  // 灯柱（木纹渐变）
  const g2=ctx.createLinearGradient(l.x-3,0,l.x+3,0);
  g2.addColorStop(0,'#5a3a22');g2.addColorStop(.5,'#7a5638');g2.addColorStop(1,'#4a3526');
  ctx.fillStyle=g2;ctx.fillRect(l.x-3,l.y-8,6,23);
  // 横臂
  ctx.fillStyle='#5a3a22';ctx.fillRect(l.x-16,l.y-8,32,3);
  ctx.fillStyle='#6e452c';ctx.fillRect(l.x-16,l.y-6,32,1);
  // 双灯罩 + 光晕
  [-15,15].forEach(dx=>{
    ctx.fillStyle='#ffe9a8';ctx.beginPath();ctx.arc(l.x+dx,l.y-14,5,0,7);ctx.fill();
    ctx.fillStyle='#fff6d8';ctx.beginPath();ctx.arc(l.x+dx,l.y-15,2.4,0,7);ctx.fill();
    const glow=l.big?15:11;
    ctx.fillStyle='rgba(255,233,168,.30)';ctx.beginPath();ctx.arc(l.x+dx,l.y-14,glow,0,7);ctx.fill();
    // 素材灯泡光晕（RPicster glow_effect，CC0）
    if(A.glow_effect_1&&A.glow_effect_1.complete&&A.glow_effect_1.naturalWidth){
      ctx.save(); ctx.globalCompositeOperation='lighter'; ctx.globalAlpha=0.7;
      const gs=l.big?42:30; ctx.drawImage(A.glow_effect_1, l.x+dx-gs/2, l.y-14-gs/2, gs, gs); ctx.restore();
    }
  });
}
/* ---- 围墙：砖石基座 + 铁艺栅栏（半透明，不挡视野） ---- */
function drawWall(w){
  const x=w.x*TILE, y=w.y*TILE, ww=w.w*TILE, hh=w.h*TILE;
  const horizontal = hh <= ww;
  ctx.save();
  if(horizontal){
    // 砖石基座（底部）
    ctx.fillStyle='rgba(158,126,84,.6)'; ctx.fillRect(x,y+hh-12,ww,12);
    ctx.fillStyle='rgba(120,94,60,.7)'; ctx.fillRect(x,y+hh-12,ww,2);
    ctx.fillStyle='rgba(110,86,54,.25)';
    for(let bx=x+6;bx<x+ww;bx+=14) ctx.fillRect(bx,y+hh-10,1,10);
    // 铁栏立柱
    ctx.fillStyle='rgba(96,96,108,.7)';
    for(let gx=x+4;gx<x+ww;gx+=10) ctx.fillRect(gx,y+2,2,hh-14);
    // 顶栏
    ctx.fillStyle='rgba(120,120,132,.85)'; ctx.fillRect(x,y+2,ww,3);
  } else {
    ctx.fillStyle='rgba(158,126,84,.6)'; ctx.fillRect(x,y,12,hh);
    ctx.fillStyle='rgba(120,94,60,.7)'; ctx.fillRect(x,y,2,hh);
    ctx.fillStyle='rgba(110,86,54,.25)';
    for(let by=y+6;by<y+hh;by+=14) ctx.fillRect(x+2,by,10,1);
    ctx.fillStyle='rgba(96,96,108,.7)';
    for(let gy=y+4;gy<y+hh;gy+=10) ctx.fillRect(x+2,gy,ww-8,2);
    ctx.fillStyle='rgba(120,120,132,.85)'; ctx.fillRect(x+2,y,3,hh);
  }
  ctx.restore();
}

/* ---- 小吃街摊位（2×2 格：遮阳棚 + 台面 + 食物） ---- */
function drawStall(s){
  const x=s.x*TILE,y=s.y*TILE,w=s.w*TILE,h=s.h*TILE;
  // 地面阴影
  ctx.fillStyle='rgba(0,0,0,.16)';ctx.fillRect(x+4,y+h-3,w-4,8);
  // 遮阳棚（红白条纹）
  const stripes=8;
  for(let i=0;i<stripes;i++){
    ctx.fillStyle=i%2?'#d4564b':'#f7e8d0';
    ctx.beginPath();
    ctx.moveTo(x+i*w/stripes,y+6);
    ctx.lineTo(x+(i+1)*w/stripes,y+6);
    ctx.lineTo(x+(i+1)*w/stripes-4,y);
    ctx.lineTo(x+i*w/stripes+4,y);
    ctx.closePath();ctx.fill();
  }
  ctx.fillStyle='#8a5a3b';ctx.fillRect(x+2,y+6,w-4,5);
  // 台面
  ctx.fillStyle='#caa46a';ctx.fillRect(x+5,y+h-22,w-10,12);
  ctx.fillStyle='#5a3a22';ctx.fillRect(x+4,y+h-12,w-8,3);
  // 立柱
  ctx.fillStyle='#6e452c';ctx.fillRect(x+4,y+10,4,h-32);ctx.fillRect(x+w-8,y+10,4,h-32);
  // 食物 emoji
  ctx.font=(s.w*TILE*0.55)+'px sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.fillText(s.emoji,x+w/2,y+h-14);
  // 招牌
  const tw=s.name.length*13+26;
  ctx.fillStyle='rgba(255,250,240,.97)';ctx.fillRect(x+w/2-tw/2,y-24,tw,20);
  ctx.strokeStyle='#6e452c';ctx.lineWidth=2;ctx.strokeRect(x+w/2-tw/2,y-24,tw,20);
  ctx.fillStyle='#6e452c';ctx.font='12px "ZCOOL KuaiLe",sans-serif';ctx.textBaseline='alphabetic';
  ctx.fillText(s.emoji+' '+s.name,x+w/2,y-10);
}
/* ---- 视野内绘制背景（只画 [cx, cx+LOGIC_W] × [cy, cy+LOGIC_H]） ---- */
function visRect(cx,cy){
  return {
    x0:Math.max(0,Math.floor(cx/TILE)-1), y0:Math.max(0,Math.floor(cy/TILE)-1),
    x1:Math.min(COLS-1,Math.ceil((cx+LOGIC_W)/TILE)+1), y1:Math.min(ROWS-1,Math.ceil((cy+LOGIC_H)/TILE)+1)
  };
}
function inView(cx,cy,r){
  const rx=cx*TILE, ry=cy*TILE;
  return rx+TILE>r.x0&&rx<r.x1*TILE+TILE&&ry+TILE>r.y0&&ry<r.y1*TILE+TILE;
}
function drawMapVisible(cx,cy){
  const r=visRect(cx,cy);
  // 地面草皮 / 道路（三类：马路 / 土路 / 鹅卵石）
  for(let y=r.y0;y<=r.y1;y++)for(let x=r.x0;x<=r.x1;x++){
    let path=null;
    for(const p of PATHS) if(x>=p.x&&x<p.x+p.w&&y>=p.y&&y<p.y+p.h){path=p;break;}
    if(path){drawPathTile(x,y,path);continue;}
    drawGrassTile(x,y);
  }
  // 广场
  SQUARES.forEach(s=>{if(inView(s.x,s.y,r))drawSquare(s);});
  // 花
  flowers.forEach(f=>{if(f.x>cx-40&&f.x<cx+LOGIC_W+40&&f.y>cy-40&&f.y<cy+LOGIC_H+40)drawFlower(f);});
  // 灌木
  bushes.forEach(b=>{if(b.x>cx-40&&b.x<cx+LOGIC_W+40&&b.y>cy-40&&b.y<cy+LOGIC_H+40)drawBush(b);});
  // 河流
  LAKE.forEach(p=>{if(inView(p.x,p.y,r))drawLake(p);}); PONDS.forEach(p=>{if(inView(p.x,p.y,r))drawPond(p);});
  // 桥梁（画在河上）
  LAKE_BRIDGES.forEach(b=>{if(inView(b.x,b.y,r))drawBridge(b);});
  // 操场
  TRACKS.forEach(t=>{if(inView(t.x,t.y,r))drawTrack(t);});
  // 树（画在草地/装饰之上）
  trees.forEach(t=>{if(t.x>cx-40&&t.x<cx+LOGIC_W+40&&t.y>cy-40&&t.y<cy+LOGIC_H+40)drawTree(t);});
  // 建筑
  BUILDINGS.forEach(b=>{if(inView(b.x,b.y,r))drawBuilding(b);});
  // 小吃摊位
  STALLS.forEach(s=>{if(inView(s.x,s.y,r))drawStall(s);});
  // 围墙 / 门 / 牌 / 路灯 / 长椅
  WALLS.forEach(w=>{if(inView(w.x,w.y,r))drawWall(w);});
  GATES.forEach(g=>{if(inView(g.x,g.y,r))drawGate(g);});
  SIGNS.forEach(s=>{if(inView(s.x,s.y,r))drawSign(s);});
  lamps.forEach(l=>{if(l.x>cx-60&&l.x<cx+LOGIC_W+60&&l.y>cy-60&&l.y<cy+LOGIC_H+60)drawLamp(l);});
  benches.forEach(b=>{if(b.x>cx-40&&b.x<cx+LOGIC_W+40&&b.y>cy-40&&b.y<cy+LOGIC_H+40)drawBench(b);});
}
function drawWaterSparkle(){
  const t=Date.now()/700;
  [...LAKE,...PONDS].forEach((p,pi)=>{
    const x=p.x*TILE,y=p.y*TILE,w=p.w*TILE,h=p.h*TILE;
    // 写实河流流动：water_calm 动画帧（OpenGameArt，CC0）以 screen 混合叠加在蓝色河面上
    if(A.water_calm&&A.water_calm.complete&&A.water_calm.naturalWidth){
      const FR=12, fw=1536/FR; // 每帧 128px 宽
      const fi=Math.floor(Date.now()/120)%FR;
      ctx.save();
      ctx.beginPath(); ctx.rect(x,y,w,h); ctx.clip();
      ctx.globalCompositeOperation='screen'; ctx.globalAlpha=0.55;
      ctx.drawImage(A.water_calm, fi*fw,0,fw,128, x,y,w,h);
      ctx.restore();
    }
    // 原有流动高光（保留，叠加在水面增强流动感）
    const horizontal = w>=h;
    for(let k=0;k<4;k++){
      const ph=((pi*0.37+k/4+t)%1);
      if(horizontal){
        const sx=x+w*ph, sy=y+h/2+Math.sin(ph*Math.PI*3)*2;
        ctx.strokeStyle='rgba(255,255,255,.30)';ctx.lineWidth=1.6;
        ctx.beginPath();ctx.moveTo(sx-9,sy);ctx.quadraticCurveTo(sx,sy-3,sx+9,sy);ctx.stroke();
      }else{
        const sy=y+h*ph, sx=x+w/2+Math.sin(ph*Math.PI*3)*2;
        ctx.strokeStyle='rgba(255,255,255,.26)';ctx.lineWidth=1.6;
        ctx.beginPath();ctx.moveTo(sx,sy-9);ctx.quadraticCurveTo(sx+3,sy,sx,sy+9);ctx.stroke();
      }
    }
  });
}
function drawChar(px,py,color,faceDir,walkPhase,emoji,hair){
  // 影子：随太阳水平位置偏移（太阳在东影子朝西，反之亦然）
  ctx.fillStyle='rgba(0,0,0,.18)';
  ctx.beginPath();ctx.ellipse(px+SUN.shadowDX, py+22-Math.abs(SUN.shadowDX)*0.12, 16,6,0,0,Math.PI*2);ctx.fill();
  const bob=Math.sin(walkPhase)*3;
  ctx.fillStyle=color;ctx.fillRect(px-13,py-6+bob,26,26);
  ctx.fillStyle='rgba(255,255,255,.25)';ctx.fillRect(px-13,py-6+bob,26,5);
  ctx.fillStyle='#f4c9a0';ctx.beginPath();ctx.arc(px,py-16+bob,12,0,7);ctx.fill();
  ctx.fillStyle=hair||'#5a3a22';ctx.beginPath();ctx.arc(px,py-19+bob,12,Math.PI,0);ctx.fill();
  ctx.fillStyle='#3a2f25';
  const ex=faceDir*3;
  ctx.beginPath();ctx.arc(px-4+ex,py-15+bob,1.8,0,7);ctx.fill();
  ctx.beginPath();ctx.arc(px+4+ex,py-15+bob,1.8,0,7);ctx.fill();
  // 下雨时撑伞（像素伞素材，CC0）
  if(isRaining&&A.umbrella_pixel&&A.umbrella_pixel.complete){
    const uw=28; ctx.drawImage(A.umbrella_pixel, px-uw/2, py-62, uw, uw);
  }
}

/* ---- 小坏人：可见形象（紫红衣 + 名牌 + 感叹号） ---- */
function drawVillain(v){

/* ============================================================
   时间流动（15 分钟昼夜循环）+ 天气（7~10 分钟一场 5 分钟雨）
   影子随太阳水平位置偏移；昼夜用屏幕叠层 tint + 日/月弧线
   ============================================================ */
const DAY_MS=15*60*1000;
let SUN={ph:0,dl:1,shadowDX:0,shadowLen:4};
let isRaining=false;
let weatherState='clear';
let nextRainAt=performance.now()+(7+Math.random()*3)*60*1000;
let rainEndAt=0;
let rainDrops=[];
function computeSun(){
  const ph=(performance.now()%DAY_MS)/DAY_MS;
  const dl=Math.cos((ph-0.25)*2*Math.PI);            // 1=正午 -1=午夜
  const shLen=(1-Math.max(0,Math.sin(ph*2*Math.PI)))*16+3;
  const shDX=-Math.cos(ph*2*Math.PI)*shLen;          // 影子方向与太阳相反
  SUN={ph,dl,shadowDX:shDX,shadowLen:shLen};
  return SUN;
}
function updateWeather(now){
  if(weatherState==='clear'&&now>=nextRainAt){
    weatherState='rain'; rainEndAt=now+5*60*1000; isRaining=true;
    rainDrops=[]; for(let i=0;i<170;i++) rainDrops.push({x:Math.random()*LOGIC_W,y:Math.random()*LOGIC_H,l:8+Math.random()*10,s:6+Math.random()*4});
  } else if(weatherState==='rain'&&now>=rainEndAt){
    weatherState='clear'; isRaining=false; rainDrops=[];
    nextRainAt=now+(7+Math.random()*3)*60*1000;
  }
}
function drawBuildingShadows(){
  if(Math.abs(SUN.shadowDX)<1) return;
  BUILDINGS.forEach(b=>{
    const x=b.x*TILE,y=b.y*TILE,w=b.w*TILE,h=b.h*TILE;
    if(x>camX-80&&x<camX+LOGIC_W+80&&y>camY-80&&y<camY+LOGIC_H+80){
      ctx.save(); ctx.globalAlpha=0.20; ctx.fillStyle='#000';
      ctx.beginPath(); ctx.ellipse(x+w/2+SUN.shadowDX, y+h+2, Math.max(10,w*0.5), 7, 0,0,Math.PI*2); ctx.fill(); ctx.restore();
    }
  });
}
function drawSky(){
  const ph=SUN.ph, dl=SUN.dl;
  if(dl<0){ ctx.fillStyle='rgba(12,20,58,'+(-dl*0.55)+')'; ctx.fillRect(0,0,LOGIC_W,LOGIC_H); }
  const tw=Math.max(0,1-Math.abs(dl)*4);
  if(tw>0.01){ ctx.fillStyle='rgba(255,150,70,'+(tw*0.26)+')'; ctx.fillRect(0,0,LOGIC_W,LOGIC_H); }
  const t=(ph%0.5)/0.5, cx=LOGIC_W*(0.12+0.76*t), cy=46-34*Math.sin(t*Math.PI);
  if(ph<0.5){
    ctx.save(); ctx.globalCompositeOperation='lighter';
    const g=ctx.createRadialGradient(cx,cy,2,cx,cy,26);
    g.addColorStop(0,'rgba(255,240,180,.9)'); g.addColorStop(1,'rgba(255,240,180,0)');
    ctx.fillStyle=g; ctx.beginPath(); ctx.arc(cx,cy,26,0,7); ctx.fill();
    ctx.globalCompositeOperation='source-over'; ctx.fillStyle='#ffe79a'; ctx.beginPath(); ctx.arc(cx,cy,9,0,7); ctx.fill();
    ctx.restore();
  } else {
    ctx.save(); ctx.fillStyle='#eef2ff'; ctx.beginPath(); ctx.arc(cx,cy,8,0,7); ctx.fill();
    ctx.fillStyle='rgba(12,20,58,1)'; ctx.beginPath(); ctx.arc(cx+3,cy-2,7,0,7); ctx.fill(); ctx.restore();
  }
}
function drawWeather(){
  if(!isRaining) return;
  ctx.save(); ctx.strokeStyle='rgba(175,205,235,.55)'; ctx.lineWidth=1.4;
  for(const d of rainDrops){
    d.y+=d.s; d.x-=d.s*0.3;
    if(d.y>LOGIC_H){ d.y=-d.l; d.x=Math.random()*LOGIC_W; }
    if(d.x<0) d.x+=LOGIC_W;
    ctx.beginPath(); ctx.moveTo(d.x,d.y); ctx.lineTo(d.x-2,d.y+d.l); ctx.stroke();
  }
  ctx.restore();
}
function updateCamera(){
  camX=Math.round(player.x-LOGIC_W/2); camY=Math.round(player.y-LOGIC_H/2);
  camX=Math.max(0,Math.min(camX,W-LOGIC_W)); camY=Math.max(0,Math.min(camY,H-LOGIC_H));
}
function ensureCache(){
  if(Math.abs(camX-cacheCx)<LOGIC_W/2 && Math.abs(camY-cacheCy)<LOGIC_H/2) return;
  cacheCv.width=LOGIC_W*DPR; cacheCv.height=LOGIC_H*DPR;
  cacheCtx.setTransform(DPR,0,0,DPR,0,0);
  cacheCtx.clearRect(0,0,LOGIC_W,LOGIC_H);
  const saved=ctx; ctx=cacheCtx;
  try{ drawMapVisible(camX,camY); }catch(e){ window.__showErr&&window.__showErr('bg: '+e.message); }
  ctx=saved;
  cacheCx=camX; cacheCy=camY;
}
function render(){
  updateCamera();
  computeSun();
  ensureCache();
  ctx.clearRect(0,0,LOGIC_W,LOGIC_H);
  ctx.save(); ctx.translate(-camX,-camY);
  try{ ctx.drawImage(cacheCv,cacheCx,cacheCy,LOGIC_W,LOGIC_H); }catch(e){ window.__showErr&&window.__showErr('bg draw: '+e.message); }
  drawWaterSparkle();
  try{ drawBuildingShadows(); }catch(e){ window.__showErr&&window.__showErr('bshadow: '+e.message); }
  try{
    const arr=[
      {px:player.x,py:player.y,draw:()=>drawChar(player.x,player.y,'#3b7fd4',player.dir,player.walk,'🧑')},
      ...NPCS.map(n=>({px:n.px,py:n.py,draw:()=>drawNPC(n)})),
      ...VILLAINS.map(v=>({px:v.x,py:v.y,draw:()=>drawVillain(v)})),
      ...STUDENTS.map(s=>({px:s.x,py:s.y,draw:()=>drawStudent(s)})),
      ...FIREFLIES.map(f=>({px:f.x,py:f.y,draw:()=>drawFirefly(f)})),
      ...SQUIRRELS.map(s=>({px:s.x,py:s.y,draw:()=>drawSquirrel(s)})),
      ...FROGS.map(fr=>({px:fr.x,py:fr.y,draw:()=>drawFrog(fr)})),
      ...CATS.map(c=>({px:c.x,py:c.y,draw:()=>drawCat(c)}))];
    arr.sort((a,b)=>a.py-b.py); arr.forEach(o=>o.draw());
  }catch(e){ window.__showErr&&window.__showErr('chars: '+e.message); }
  ctx.restore();
  // 屏幕空间叠层：先天气（雨）后天光（日/月 + 昼夜 tint）
  try{ drawWeather(); }catch(e){ window.__showErr&&window.__showErr('weather: '+e.message); }
  try{ drawSky(); }catch(e){ window.__showErr&&window.__showErr('sky: '+e.message); }
}

/* ---------- 移动 ---------- */
function moveTo(px,py){
  if(!passable(px,py)){
    let best=null,bd=1e9;
    for(let r=1;r<6;r++)for(let dx=-r;dx<=r;dx++)for(let dy=-r;dy<=r;dy++){
      const nx=px+dx*TILE, ny=py+dy*TILE;
      if(passable(nx,ny)){const d=Math.hypot(dx,dy);if(d<bd){bd=d;best={nx,ny};}}
    }
    if(best){px=best.nx;py=best.ny;} else return;
  }
  player.tx=px;player.ty=py;
}
let lastT=performance.now();
function loop(t){
  const dt=Math.min(32,t-lastT)/16; lastT=t;
  updateStudents(dt);
  updateAnimals(dt);
  updateWeather(performance.now());
  if(villainCD>0)villainCD--;
  else if(!dialogOpen){
    for(const v of VILLAINS){
      if(Math.hypot(player.x-v.x,player.y-v.y)<80){
        openVillainDialog(v); villainCD=300; break;
      }
    }
  }
  const dx=player.tx-player.x, dy=player.ty-player.y, dist=Math.hypot(dx,dy);
  if(dist>1.5){
    const sp=3.2*dt;
    if(dx) player.dir=dx>0?1:-1;
    player.x+=dx/dist*Math.min(sp,dist);
    player.y+=dy/dist*Math.min(sp,dist);
    player.walk+=0.3*dt;
  } else { player.walk=0; }
  let near=null, snear=null;
  NPCS.forEach(n=>{if(Math.hypot(player.x-n.px,player.y-n.py)<90)near=n;});
  STUDENTS.forEach(s=>{if(Math.hypot(player.x-s.x,player.y-s.y)<70)snear=s;});
  const tip=document.getElementById('nearTip');
  if(near&&!dialogOpen){tip.classList.add('show');tip.innerHTML='按 <b>空格</b> 或点 '+near.name+' 对话';}
  else if(snear&&!dialogOpen){tip.classList.add('show');tip.innerHTML='按 <b>空格</b> 或点 '+snear.name+' 闲聊';}
  else tip.classList.remove('show');
  render();
  requestAnimationFrame(loop);
}
spawnAnimals();
requestAnimationFrame(loop);

  clearInterval(typeTimer); dlgText.innerHTML=''; let i=0;
  typeTimer=setInterval(()=>{
    dlgText.innerHTML=text.slice(0,i)+(i<text.length?'<span class="cur">▌</span>':'');
    i++; if(i>text.length){clearInterval(typeTimer);cb&&cb();}
  },18);
}
function appendBubble(who,text){
  chatEl.style.display='flex';
  const b=document.createElement('div');b.className='bubble '+(who==='me'?'me':'npc');
  b.textContent=text; chatEl.append(b); chatEl.scrollTop=chatEl.scrollHeight;
}
function startFree(){
  mode='free'; choicesEl.innerHTML='';
  inputRow.style.display='flex'; chatInput.placeholder='问 '+activeNpc.name+' 任何课上问题…';
  chatInput.focus();
  appendBubble('npc','好呀～你尽管问，我按我的范畴回答 😊');
}
function startGrill(){
  mode='grill'; quizStep=0; quizScore=0; choicesEl.innerHTML='';
  inputRow.style.display='flex'; scoreEl.style.display='block';
  updateScore();
  const boundary='【我的边界】我负责：'+activeNpc.scope+' 不负责：'+activeNpc.out;
  typeText('来吧，Grill me！先说清楚规则——'+boundary,()=>{
    appendBubble('npc',boundary);
    askNext();
  });
}
function updateScore(){scoreEl.textContent='掌握度：'+quizStep+' / '+activeNpc.quiz.length+' 题'+(quizScore?('（已答对 '+quizScore+'）'):'');}
function askNext(){
  if(quizStep>=activeNpc.quiz.length){
    const pct=Math.round(quizScore/activeNpc.quiz.length*100);
    typeText('摸底结束！你的掌握度约 '+pct+'%。'+(pct>=66?'不错，基础挺扎实～':'建议回头再刷刷这几块哦'),()=>showChoices());
    return;
  }
  chatInput.placeholder='输入你的答案…';
  typeText('第 '+(quizStep+1)+' 题：'+activeNpc.quiz[quizStep].q,()=>{chatInput.focus();});
}
document.getElementById('sendBtn').onclick=sendMsg;
chatInput.addEventListener('keydown',e=>{if(e.code==='Enter')sendMsg();});
function sendMsg(){
  const v=chatInput.value.trim(); if(!v)return; chatInput.value='';
  appendBubble('me',v);
  if(mode==='free'){
    callLLM(buildMessages(activeNpc,'free',v)).then(r=>{
      appendBubble('npc',r.text);
      activeNpc.history.push({role:'user',content:v},{role:'assistant',content:r.text});
      if(activeNpc.history.length>12) activeNpc.history.splice(0,activeNpc.history.length-12);
      if(r.mock) toast('当前为 Demo 模式，配置后端即接真实大模型');
    });
  } else if(mode==='grill'){
    const q=activeNpc.quiz[quizStep];
    callLLM(buildMessages(activeNpc,'grill',v,q)).then(r=>{
      appendBubble('npc',r.text);
      if(r.mock){
        const hit=q.a.split(/[，。、]/)[0].slice(0,4);
        if(v.includes(hit)||v.length>6){quizScore++; toast('✅ 答得不错');}
        else toast('💡 参考：'+q.a);
      }
      quizStep++; updateScore(); askNext();
    });
  }
}
function buildMessages(npc,mode,userText,quiz){
  let sys;
  if(npc.id==='senpai'){
    sys = mode==='grill'
      ? `[身份]你是「学长」，上海立信会计金融学院的在校生向导，热情、熟悉学校与「立信学习」站点全部内容。\n[知识库]${LIXIN_KB}\n[边界]只介绍站点里真实存在的内容与学校公开信息；站点没有的资料或题目，请诚实说“这个我不确定 / 站点里没有”，不要编造。\n[MODE:GRILL]用户刚回答了一道关于立信学习平台 / 校区 / 课程的问题。题目：${quiz?quiz.q:'-'} 参考要点：${quiz?quiz.a:'-'}。用 2-3 句点评，肯定正确、指出遗漏，不敷衍。`
      : `[身份]你是「学长」，上海立信会计金融学院的在校生向导，热情、熟悉学校与「立信学习」站点全部内容。\n[知识库]${LIXIN_KB}\n[自由问答]用简洁易懂的中文回答用户关于立信学习平台、各门课程板块、校区、备考 / 刷题路径的问题；站点没有的请诚实说明，不要编造。`;
  } else {
    sys = mode==='grill'
      ? `[身份]你是「${npc.name}」，${npc.title}，性格亲切但严谨。\n[知识边界]你只负责：${npc.scope}。超出范围的，礼貌说明不在你的职责内，不编造。\n[MODE:GRILL]现在进行“Grill me 摸底”：用户刚回答了一道题。题目：${quiz?quiz.q:'-'} 标准答案要点：${quiz?quiz.a:'-'}。请用中文点评用户回答是否到位（2-3句），肯定正确的部分，指出遗漏，不要直接给满分式敷衍。若用户基本答对，鼓励并提示可进入下一题。`
      : `[身份]你是「${npc.name}」，${npc.title}，性格亲切。\n[知识边界]你只负责：${npc.scope}。超出范围请礼貌说明不负责、不编造。\n[自由问答]用简洁易懂的中文回答用户关于本课程的问题，可举例。`;
  }
  const hist=[{role:'system',content:sys}];
  if(mode!=='grill' && npc.history && npc.history.length) hist.push(...npc.history);
  if(mode==='grill') hist.push({role:'user',content:'（这是我的回答）'+userText});
  else hist.push({role:'user',content:userText});
  return hist;
}
async function callLLM(messages){
  const url=(localStorage.getItem('lixin_rpg_backend')||'').trim();
  if(url){
    try{
      const r=await fetch(url.replace(/\/$/,'')+'/api/llm/chat',{
        method:'POST',headers:{'Content-Type':'application/json'},
        body:JSON.stringify({messages,model:localStorage.getItem('lixin_rpg_model')||''})
      });
      if(r.ok){const j=await r.json(); if(j.reply) return {text:j.reply,mock:!!j.mock};}
    }catch(e){}
  }
  return {text:mockReply(messages),mock:true};
}
function mockReply(messages){
  const sys=messages[0].content, user=messages[messages.length-1].content;
  const npc=activeNpc;
  const nick=npc?npc.name:'该角色';
  if(sys.includes('[MODE:GRILL]')){
    const q=(npc&&npc.quiz&&npc.quiz[quizStep])?npc.quiz[quizStep]:{a:''};
    const hit=q.a.split(/[，。、]/)[0].slice(0,5);
    if(user.length>6&&user.includes(hit)) return '答到点子上了！'+q.a.slice(0,18)+'…这部分你掌握得不错，我们继续下一题👍（Demo 模式）';
    return '嗯，方向对，但还差一点：'+q.a+'。没关系，记下来，咱们下一题～（Demo 模式）';
  }
  return '（未配置 LLM 后端）'+nick+'点了点头：「'+user.slice(0,14)+(user.length>14?'…':'')+'」这个问题等我接到真实后端再细说，请先在右上角 ⚙ 设置里填写后端地址。';
}
