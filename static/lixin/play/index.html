<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Lixin</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=VT323&family=ZCOOL+KuaiLe&display=swap" rel="stylesheet" />
<style>
  :root{
    --grass:#7cb86a; --grass2:#74b062; --dirt:#caa472; --dirt2:#bd9663;
    --wood:#8a5a3b; --wood-d:#6e452c; --water:#6db8e0; --water-d:#4f9fd0;
    --ink:#3a2f25; --paper:#fff7e6; --paper-d:#f0e2c4;
    --brand:#d98a1f; --brand-d:#b9700f;
    --panel:#fffaf0; --shadow:rgba(60,40,20,.25);
    --ok:#2f9e6b; --bad:#d4564b;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;height:100%;}
  body{
    font-family:'ZCOOL KuaiLe','PingFang SC','Microsoft YaHei',system-ui,sans-serif;
    background:radial-gradient(circle at 50% 0%, #bfe6a8, #9ed188 60%, #8cc778);
    color:var(--ink); overflow:hidden; user-select:none;
  }
  .wrap{position:fixed;inset:0;display:flex;flex-direction:column;}
  /* 顶部 HUD */
  .hud{
    display:flex;align-items:center;gap:12px;padding:10px 16px;
    background:linear-gradient(180deg,rgba(255,250,240,.95),rgba(255,250,240,.7));
    border-bottom:3px solid var(--wood); box-shadow:0 3px 10px var(--shadow); z-index:5;
  }
  .hud h1{font-size:22px;margin:0;color:var(--wood-d);letter-spacing:1px;
    text-shadow:1px 1px 0 #fff;}
  .hud .hint{font-size:13px;color:#6b5a44;opacity:.85;}
  .hud .spacer{flex:1;}
  .btn{
    font-family:inherit;cursor:pointer;border:none;border-radius:999px;
    padding:8px 16px;font-size:15px;background:var(--brand);color:#fff;
    box-shadow:0 3px 0 var(--brand-d);transition:transform .08s, box-shadow .08s;
  }
  .btn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--brand-d);}
  .btn.ghost{background:#fff;color:var(--wood-d);box-shadow:0 3px 0 #d9c7a3;}
  .btn.sm{padding:6px 12px;font-size:13px;}
  /* 地图区 */
  .stage{flex:1;position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden;}
  canvas{image-rendering:pixelated;background:#7cb86a;border-radius:14px;
    box-shadow:0 10px 30px var(--shadow), inset 0 0 0 4px var(--wood);
    max-width:100%;max-height:100%;touch-action:none;}
  /* 村民图鉴弹窗 */
  .codex{position:absolute;inset:0;display:none;align-items:center;justify-content:center;
    background:rgba(40,30,20,.45);z-index:12;padding:16px;}
  .codex.show{display:flex;}
  .codex-inner{position:relative;background:var(--panel);border:4px solid var(--wood);
    border-radius:16px;width:min(780px,96vw);max-height:88%;overflow:auto;padding:18px;
    box-shadow:0 14px 34px var(--shadow);}
  .codex h3{margin:0 0 12px;font-size:20px;color:var(--wood-d);}
  .codex .close{position:absolute;right:10px;top:10px;cursor:pointer;font-size:20px;color:#9a8a6a;
    width:30px;height:30px;display:flex;align-items:center;justify-content:center;border-radius:50%;}
  .codex .close:hover{background:var(--paper-d);}
  .codex-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px;}
  .ccard{border:2px solid var(--wood);border-radius:12px;padding:10px;background:var(--paper);
    display:flex;flex-direction:column;}
  .ccard .top{display:flex;gap:10px;align-items:center;}
  .ccard .p{width:50px;height:50px;border-radius:10px;flex:none;display:flex;align-items:center;
    justify-content:center;font-size:28px;border:2px solid var(--wood-d);}
  .ccard .nm{font-size:17px;color:var(--wood-d);margin:0;}
  .ccard .tt{font-size:12px;color:#8a7355;margin-top:1px;}
  .ccard .intro{font-size:13px;line-height:1.6;color:var(--ink);margin-top:8px;flex:1;}
  .ccard .bdr{font-size:12px;color:var(--brand-d);margin-top:6px;background:var(--paper-d);
    border-radius:8px;padding:6px 8px;line-height:1.5;}
  .ccard .go{margin-top:10px;}
  /* 对话面板 */
  .dialog{
    position:absolute;left:50%;bottom:18px;transform:translateX(-50%) translateY(140%);
    width:min(680px,94vw);background:var(--panel);border:4px solid var(--wood);
    border-radius:16px;box-shadow:0 12px 30px var(--shadow);padding:14px;z-index:8;
    transition:transform .25s cubic-bezier(.2,.9,.3,1.2);
  }
  .dialog.show{transform:translateX(-50%) translateY(0);}
  .dlg-top{display:flex;gap:12px;align-items:flex-start;}
  .portrait{width:64px;height:64px;border-radius:12px;flex:none;border:3px solid var(--wood-d);
    display:flex;align-items:center;justify-content:center;font-size:34px;background:#ffe;}
  .dlg-name{font-size:18px;color:var(--wood-d);margin:0 0 2px;}
  .dlg-title{font-size:12px;color:#8a7355;}
  .dlg-text{margin:8px 2px 4px;font-size:16px;line-height:1.6;min-height:48px;
    background:var(--paper);border-radius:10px;padding:8px 10px;border:1px solid var(--paper-d);}
  .dlg-text .cur{color:var(--brand-d);font-weight:bold;}
  .choices{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px;}
  .chat{margin-top:8px;display:flex;flex-direction:column;gap:6px;max-height:150px;overflow:auto;}
  .bubble{max-width:85%;padding:7px 11px;border-radius:12px;font-size:15px;line-height:1.5;}
  .bubble.me{align-self:flex-end;background:var(--brand);color:#fff;border-bottom-right-radius:3px;}
  .bubble.npc{align-self:flex-start;background:var(--paper);border:1px solid var(--paper-d);border-bottom-left-radius:3px;}
  .input-row{display:flex;gap:8px;margin-top:8px;}
  .input-row input{flex:1;font-family:inherit;font-size:15px;padding:9px 12px;border-radius:10px;
    border:2px solid var(--wood);background:#fff;color:var(--ink);outline:none;}
  .input-row input:focus{border-color:var(--brand);}
  .score{font-size:13px;color:var(--brand-d);margin-top:4px;}
  /* 设置面板 */
  .settings{position:absolute;right:14px;top:14px;background:rgba(255,250,240,.96);
    border:3px solid var(--wood);border-radius:14px;padding:12px;width:260px;z-index:9;
    box-shadow:0 8px 20px var(--shadow);display:none;}
  .settings.show{display:block;}
  .settings h3{margin:0 0 8px;font-size:16px;color:var(--wood-d);}
  .settings label{font-size:12px;color:#6b5a44;display:block;margin:8px 0 3px;}
  .settings input{width:100%;font-family:inherit;font-size:13px;padding:7px 9px;border-radius:8px;
    border:2px solid var(--wood);background:#fff;outline:none;}
  .settings .mode{font-size:12px;color:#6b5a44;margin-top:8px;line-height:1.5;}
  .settings .close{position:absolute;right:8px;top:6px;cursor:pointer;font-size:18px;color:#9a8a6a;}
  /* 更新日志面板（右上角） */
  .changelog{position:absolute;right:14px;top:14px;background:rgba(255,250,240,.97);
    border:3px solid var(--wood);border-radius:14px;padding:12px 14px;width:310px;max-height:74%;
    overflow:auto;z-index:9;box-shadow:0 8px 20px var(--shadow);display:none;}
  .changelog.show{display:block;}
  .changelog h3{margin:0 0 6px;font-size:16px;color:var(--wood-d);}
  .changelog .close{position:absolute;right:8px;top:6px;cursor:pointer;font-size:18px;color:#9a8a6a;
    width:28px;height:28px;display:flex;align-items:center;justify-content:center;border-radius:50%;}
  .changelog .close:hover{background:var(--paper-d);}
  .changelog .ver{font-size:14px;color:var(--brand-d);font-weight:bold;margin:10px 0 3px;
    border-bottom:2px solid var(--paper-d);padding-bottom:3px;}
  .changelog .ver:first-of-type{margin-top:2px;}
  .changelog .date{font-size:11px;color:#9a8a6a;font-weight:normal;margin-left:6px;}
  .changelog ul{margin:4px 0 6px;padding-left:18px;}
  .changelog li{font-size:12.5px;color:var(--ink);line-height:1.6;margin:3px 0;}
  .toast{position:absolute;left:50%;top:14px;transform:translateX(-50%);
    background:rgba(58,47,37,.92);color:#fff;padding:8px 16px;border-radius:999px;font-size:14px;
    z-index:20;opacity:0;transition:opacity .3s;pointer-events:none;}
  .toast.show{opacity:1;}
  .near-tip{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);
    background:rgba(255,250,240,.95);border:2px solid var(--brand);border-radius:999px;
    padding:6px 16px;font-size:14px;color:var(--wood-d);z-index:6;display:none;}
  .near-tip.show{display:block;animation:bob 1s infinite ease-in-out;}
  @keyframes bob{50%{transform:translateX(-50%) translateY(-4px);}}
</style>
</head>
<body>
<div class="wrap">
  <div class="hud">
    <h1>🌾 Lixin</h1>
    <span class="hint">点地面走动 · 点学长问全站 · 点村民聊单科 · 文翔路/上川路两校区随便逛</span>
    <span class="spacer"></span>
    <button class="btn ghost sm" id="codexBtn">📖 村民图鉴</button>
    <button class="btn ghost sm" id="helpBtn">玩法</button>
    <button class="btn ghost sm" id="logBtn">📜 更新日志</button>
    <button class="btn ghost sm" id="setBtn">⚙ 设置</button>
  </div>

  <div class="stage" id="stage">
    <canvas id="game" width="960" height="672"></canvas>
    <div class="near-tip" id="nearTip">按 <b>空格</b> 或点击村民对话</div>

    <div class="dialog" id="dialog">
      <div class="dlg-top">
        <div class="portrait" id="dlgPortrait">🧑‍🏫</div>
        <div>
          <p class="dlg-name" id="dlgName">村民</p>
          <div class="dlg-title" id="dlgTitle"></div>
        </div>
      </div>
      <div class="dlg-text" id="dlgText"></div>
      <div class="choices" id="choices"></div>
      <div class="chat" id="chat" style="display:none"></div>
      <div class="input-row" id="inputRow" style="display:none">
        <input id="chatInput" placeholder="说点什么…（Enter 发送）" autocomplete="off" />
        <button class="btn sm" id="sendBtn">发送</button>
      </div>
      <div class="score" id="score" style="display:none"></div>
    </div>

    <div class="settings" id="settings">
      <span class="close" id="setClose">✕</span>
      <h3>⚙ LLM 设置</h3>
      <label>后端地址（留空则用内置 Demo）</label>
      <input id="cfgBackend" placeholder="https://你的后端/api" />
      <label>模型名（可选）</label>
      <input id="cfgModel" placeholder="gpt-4o-mini / deepseek-chat …" />
      <div class="mode" id="cfgMode">当前模式：<b>内置 Demo</b><br>
        配置后端并部署 <code>/api/llm/chat</code> 后，对话会走真实大模型。密钥放在后端环境变量，绝不进前端。</div>
      <button class="btn sm" id="cfgSave" style="margin-top:10px;width:100%">保存</button>
    </div>

    <div class="changelog" id="changelog">
      <span class="close" id="logClose">✕</span>
      <h3>📜 更新日志</h3>
      <div id="logBody"></div>
    </div>

    <div class="codex" id="codex">
      <div class="codex-inner">
        <span class="close" id="codexClose">✕</span>
        <h3>📖 村民图鉴</h3>
        <div class="codex-grid" id="codexGrid"></div>
      </div>
    </div>

    <div class="toast" id="toast"></div>
    <div id="errBar" style="position:absolute;left:50%;bottom:50px;transform:translateX(-50%);z-index:99;background:rgba(212,86,75,.95);color:#fff;padding:6px 14px;border-radius:8px;font:12px/1.4 monospace;max-width:90%;display:none;cursor:pointer;white-space:pre-wrap;"></div>
  </div>
</div>

<script>
/* ============================================================
   Lixin · 学习 RPG  ——  单文件可交互 Demo
   - canvas 俯视地图，点击走动
   - 6 个学科 NPC，点击对话
   - 对话接 LLM（可配置后端 /api/llm/chat），失败降级内置 mock
   - Grill me：村民先划清知识边界，再逐题摸底
   ============================================================ */
// 错误条：把任何未捕获异常显示在屏幕上（仅出错时显示，默认隐藏）
(function(){
  var bar=document.getElementById('errBar');
  if(!bar) return;
  bar.title='点击关闭';
  bar.onclick=function(){bar.style.display='none';};
  function show(msg){ bar.textContent='⚠ '+msg; bar.style.display='block'; }
  window.addEventListener('error',function(e){show((e.message||e)+' ('+(e.filename||'')+':'+(e.lineno||'')+')');});
  window.addEventListener('unhandledrejection',function(e){show('Promise: '+(e.reason&&e.reason.message||e.reason));});
  window.__showErr=show;
})();


/* ---------- 学科 / NPC 数据 ---------- */
/* ---------- 立信学习全站知识库（学长专用，全量注入） ---------- */

1. 会计学原理（基础会计）：按「知识点(8章)→选择题→判断题→业务题(分录/试算平衡/平行登记)」组织，含 T 型账户、扫描 PDF/Word/真题图。
2. 微积分（一）（高数上）：函数极限、导数微分、中值定理、不定积分、定积分、定积分应用；知识点框架 + 2015–2016 至 2024–2025 十年期末真题（图片化）。
3. 微积分（二）（高数下）：定积分、常微分方程、多元函数微分学、二重积分、无穷级数；知识点(LaTeX)+习题套卷+历年真题。
4. 线性代数：行列式、线性方程组等讲义截图；22/23级阶段与期中测验；历年试卷 2017–2025 及 2004–2016 历年试题(PDF/DOC)。
5. 概率论与数理统计（经管）：按题型(选择/填空/计算/应用)归类 2016–2021 七套卷；2022-2023/2023-2024/2024-2025 三套完整卷；公式 LaTeX。
6. Python 程序设计基础：语法/数据类型/流程控制/组合数据类型；单选题/判断题/编程题/扫描讲义；含闯关训练、阶段/期中/期末。
站点还内置一个星露谷风格的 RPG 小游戏（Lixin）：点地面让小人走动、点村民对话，每位村民对应一门课，对话可选「💬自由问答」或「🔥Grill me 摸底」（村民先划清知识边界再逐题考你）。`;

const NPCS = [

    scope:'「立信学习」全站内容与上海立信会计金融学院两校区公开信息（课程板块、历年真题、备考路径）。',

  },

  {

function drawWaterSparkle(){

  [...LAKE,...PONDS].forEach((p,i)=>{
    const cx=(p.x+p.w/2)*TILE, cy=(p.y+p.h/2)*TILE;

    ctx.fillStyle='rgba(255,255,255,.45)';
    ctx.beginPath();ctx.arc(sx,sy,2.4,0,7);ctx.fill();
  });
}
function drawTile(x,y,c){ctx.fillStyle=c;ctx.fillRect(x*TILE,y*TILE,TILE,TILE);}
function shade(hex,amt){
  const c=hex.replace('#','');let r=parseInt(c.substr(0,2),16),g=parseInt(c.substr(2,2),16),b=parseInt(c.substr(4,2),16);
  r=Math.max(0,Math.min(255,r+amt));g=Math.max(0,Math.min(255,g+amt));b=Math.max(0,Math.min(255,b+amt));
  return 'rgb('+r+','+g+','+b+')';
}
function drawRoof(b,x,y,w,h){
  const rh=Math.max(14,Math.min(26,h*0.5));
  const dark=shade(b.color,-34), mid=shade(b.color,-14);
  if(b.type==='gym'){
    ctx.fillStyle=dark;ctx.beginPath();ctx.moveTo(x-3,y);ctx.lineTo(x+w+3,y);
    ctx.quadraticCurveTo(x+w/2,y-rh-12,x-3,y);ctx.closePath();ctx.fill();
    ctx.fillStyle=mid;ctx.fillRect(x-3,y-3,w+6,5);return;
  }
  ctx.fillStyle=dark;ctx.beginPath();ctx.moveTo(x-4,y);ctx.lineTo(x+w/2,y-rh);ctx.lineTo(x+w+4,y);ctx.closePath();ctx.fill();
  ctx.fillStyle=mid;ctx.beginPath();ctx.moveTo(x-4,y);ctx.lineTo(x+w/2,y-rh);ctx.lineTo(x+w/2,y-rh+5);ctx.lineTo(x-2,y);ctx.closePath();ctx.fill();
  if(b.type==='landmark'){
    const cx=x+w/2, cy=y-rh-14;
    ctx.fillStyle='#8a5a3b';ctx.fillRect(cx-6,cy,12,16);
    ctx.fillStyle='#f3d27a';ctx.beginPath();ctx.arc(cx,cy+7,6,0,7);ctx.fill();
    ctx.strokeStyle='#6e452c';ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(cx,cy+2);ctx.lineTo(cx,cy+12);ctx.moveTo(cx-5,cy+7);ctx.lineTo(cx+5,cy+7);ctx.stroke();
    ctx.fillStyle='#d9b24a';ctx.fillRect(x-4,y-rh-2,w+8,4);
  }
  if(b.type==='library'){
    ctx.fillStyle='#efe2c4';
    const step=Math.max(14,(w-16)/4);
    for(let i=x+8;i<x+w-8;i+=step)ctx.fillRect(i,y+h-8,7,h+8);
  }
}

function drawSquare(s){

  // 中心雕塑 / 立柱
  ctx.fillStyle='rgba(0,0,0,.12)';ctx.beginPath();ctx.ellipse(x+w/2,y+h/2+12,10,4,0,0,Math.PI*2);ctx.fill();

function drawTree(t){

function drawMap(){
  for(let y=0;y<ROWS;y++)for(let x=0;x<COLS;x++){
    let base;
    if(PLAZA.includes(x)) base=((x+y)&1)?'#e0c98f':'#d8c083';
    else base=((x+y)&1)?'#7cb86a':'#74b062';
    drawTile(x,y,base);
  }
  PATHS.forEach(p=>{for(let y=p.y;y<p.y+p.h;y++)for(let x=p.x;x<p.x+p.w;x++)if(x>=0&&x<COLS&&y>=0&&y<ROWS)drawTile(x,y,((x&1)?'#caa472':'#bd9663'));});

  flowers.forEach(f=>{ctx.fillStyle=f.c;ctx.beginPath();ctx.arc(f.x,f.y,2.6,0,7);ctx.fill();});
  bushes.forEach(drawBush);
  LAKE.forEach(drawLake); PONDS.forEach(drawLake);
  TRACKS.forEach(drawTrack);
  trees.forEach(drawTree);
  BUILDINGS.forEach(drawBuilding);

}
function drawChar(px,py,color,faceDir,walkPhase,emoji){

  ctx.fillStyle=color;ctx.fillRect(px-13,py-6+bob,26,26);

  // 眼睛
  ctx.fillStyle='#3a2f25';
  const ex=faceDir*3;
  ctx.beginPath();ctx.arc(px-4+ex,py-15+bob,1.8,0,7);ctx.fill();

function updateCamera(){
  camX=Math.round(player.x-cv.width/2); camY=Math.round(player.y-cv.height/2);
  camX=Math.max(0,Math.min(camX,W-cv.width)); camY=Math.max(0,Math.min(camY,H-cv.height));
}
function render(){
  updateCamera();

  ctx.save(); ctx.translate(-camX,-camY);
  try{ ctx.drawImage(bgCv,0,0); }catch(e){ window.__showErr&&window.__showErr('bg draw: '+e.message); }
  drawWaterSparkle();
  try{
    const arr=[{px:player.x,py:player.y,draw:()=>drawChar(player.x,player.y,'#3b7fd4',player.dir,player.walk,'🧑')},
      ...NPCS.map(n=>({px:n.px,py:n.py,draw:()=>drawNPC(n)}))];
    arr.sort((a,b)=>a.py-b.py); arr.forEach(o=>o.draw());
  }catch(e){ window.__showErr&&window.__showErr('chars: '+e.message); }
  ctx.restore();
}

/* ---------- 移动 ---------- */
function moveTo(px,py){
  // 找最近可通行点
  if(!passable(px,py)){
    let best=null,bd=1e9;
    for(let r=1;r<6;r++)for(let dx=-r;dx<=r;dx++)for(let dy=-r;dy<=r;dy++){
      const nx=px+dx*TILE, ny=py+dy*TILE;
      if(passable(nx,ny)){const d=Math.hypot(dx,dy);if(d<bd){bd=d;best={nx,ny};}}
    }
    if(best){px=best.nx;py=best.ny;} else return;
  }
  player.tx=px;player.ty=py;
}
let lastT=performance.now();
function loop(t){
  const dt=Math.min(32,t-lastT)/16; lastT=t;
  const dx=player.tx-player.x, dy=player.ty-player.y, dist=Math.hypot(dx,dy);
  if(dist>1.5){
    const sp=3.2*dt;
    if(dx) player.dir=dx>0?1:-1;
    player.x+=dx/dist*Math.min(sp,dist);
    player.y+=dy/dist*Math.min(sp,dist);
    player.walk+=0.3*dt;
  } else { player.walk=0; }
  // 邻近提示
  let near=null;
  NPCS.forEach(n=>{if(Math.hypot(player.x-n.px,player.y-n.py)<90)near=n;});
  const tip=document.getElementById('nearTip');
  if(near&&!dialogOpen){tip.classList.add('show');tip.innerHTML='按 <b>空格</b> 或点 '+near.name+' 对话';}
  else tip.classList.remove('show');
  render();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

  if(quizStep>=activeNpc.quiz.length){
    const pct=Math.round(quizScore/activeNpc.quiz.length*100);

    return;
  }
  chatInput.placeholder='输入你的答案…';

function sendMsg(){
  const v=chatInput.value.trim(); if(!v)return; chatInput.value='';
  appendBubble('me',v);
  if(mode==='free'){
    callLLM(buildMessages(activeNpc,'free',v)).then(r=>{
      appendBubble('npc',r.text);
      activeNpc.history.push({role:'user',content:v},{role:'assistant',content:r.text});
      if(activeNpc.history.length>12) activeNpc.history.splice(0,activeNpc.history.length-12);
      if(r.mock) toast('当前为 Demo 模式，配置后端即接真实大模型');
    });
  } else if(mode==='grill'){
    const q=activeNpc.quiz[quizStep];
    // 真实 LLM：把标准答案作为评分依据；mock：本地评分
    callLLM(buildMessages(activeNpc,'grill',v,q)).then(r=>{
      appendBubble('npc',r.text);
      if(r.mock){ // 本地宽松评分
        const hit=q.a.split(/[，。、]/)[0].slice(0,4);
        if(v.includes(hit)||v.length>6){quizScore++; toast('✅ 答得不错');}
        else toast('💡 参考：'+q.a);
      }
      quizStep++; updateScore(); askNext();
    });
  }
}

/* ---------- 构造 messages ---------- */
function buildMessages(npc,mode,userText,quiz){
  let sys;
  if(npc.id==='senpai'){
    sys = mode==='grill'
      ? `[身份]你是「学长」，上海立信会计金融学院的在校生向导，热情、熟悉学校与「立信学习」站点全部内容。\n[知识库]${LIXIN_KB}\n[边界]只介绍站点里真实存在的内容与学校公开信息；站点没有的资料或题目，请诚实说“这个我不确定 / 站点里没有”，不要编造。\n[MODE:GRILL]用户刚回答了一道关于立信学习平台 / 校区 / 课程的问题。题目：${quiz?quiz.q:'-'} 参考要点：${quiz?quiz.a:'-'}。用 2-3 句点评，肯定正确、指出遗漏，不敷衍。`
      : `[身份]你是「学长」，上海立信会计金融学院的在校生向导，热情、熟悉学校与「立信学习」站点全部内容。\n[知识库]${LIXIN_KB}\n[自由问答]用简洁易懂的中文回答用户关于立信学习平台、各门课程板块、校区、备考 / 刷题路径的问题；站点没有的请诚实说明，不要编造。`;
  } else {
    sys = mode==='grill'
      ? `[身份]你是「${npc.name}」，${npc.title}，性格亲切但严谨。\n[知识边界]你只负责：${npc.scope}。超出范围的，礼貌说明不在你的职责内，不编造。\n[MODE:GRILL]现在进行“Grill me 摸底”：用户刚回答了一道题。题目：${quiz?quiz.q:'-'} 标准答案要点：${quiz?quiz.a:'-'}。请用中文点评用户回答是否到位（2-3句），肯定正确的部分，指出遗漏，不要直接给满分式敷衍。若用户基本答对，鼓励并提示可进入下一题。`
      : `[身份]你是「${npc.name}」，${npc.title}，性格亲切。\n[知识边界]你只负责：${npc.scope}。超出范围请礼貌说明不负责、不编造。\n[自由问答]用简洁易懂的中文回答用户关于本课程的问题，可举例。`;
  }
  const hist=[{role:'system',content:sys}];
  if(mode!=='grill' && npc.history && npc.history.length) hist.push(...npc.history);
  if(mode==='grill') hist.push({role:'user',content:'（这是我的回答）'+userText});
  else hist.push({role:'user',content:userText});
  return hist;
}

/* ---------- LLM 调用：后端优先，失败降级 mock ---------- */
async function callLLM(messages){
  const url=(localStorage.getItem('lixin_rpg_backend')||'').trim();
  if(url){
    try{
      const r=await fetch(url.replace(/\/$/,'')+'/api/llm/chat',{
        method:'POST',headers:{'Content-Type':'application/json'},
        body:JSON.stringify({messages,model:localStorage.getItem('lixin_rpg_model')||''})
      });
      if(r.ok){const j=await r.json(); if(j.reply) return {text:j.reply,mock:!!j.mock};}
    }catch(e){/* 降级 */}
  }
  return {text:mockReply(messages),mock:true};
}
function mockReply(messages){
  const sys=messages[0].content, user=messages[messages.length-1].content;
  const npc=activeNpc;
  if(npc.id==='senpai'){
    if(sys.includes('[MODE:GRILL]')){
      const q=npc.quiz[quizStep]||{a:''};
      const hit=q.a.split(/[，。、]/)[0].slice(0,5);
      if(user.length>6&&user.includes(hit)) return '答对啦，记性不错！'+q.a.slice(0,18)+'… 这块你门儿清，下一题继续👍';
      return '方向对，但还有细节：'+q.a+'。不急，记下来就好～';
    }
    return '（Demo 模式）学长说：关于「'+user.slice(0,14)+(user.length>14?'…':'')+'」——「立信学习」有 6 大板块（会计学 / 微积分一二 / 线代 / 概率论 / Python），松江+浦东两校区，历年真题随便刷～配置后端 /api/llm/chat 后我就能按全站知识库细答啦！';
  }
  if(sys.includes('[MODE:GRILL]')){
    const q=npc.quiz[quizStep]||{a:''};
    const hit=q.a.split(/[，。、]/)[0].slice(0,5);
    if(user.length>6&&user.includes(hit)) return '答到点子上了！'+q.a.slice(0,18)+'…这部分你掌握得不错，我们继续下一题👍';
    return '嗯，方向对，但还差一点：'+q.a+'。没关系，记下来，咱们下一题～';
  }
  return '（Demo 模式）'+npc.name+'说：关于「'+user.slice(0,12)+(user.length>12?'…':'')+'」——我主要管 '+npc.scope.slice(0,16)+'… 配置后端 /api/llm/chat 后我就能接真实大模型细聊啦！';
}

});
