<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Lixin 贴图编辑器</title>
<style>
  :root{--wood:#6b4f2a;--wood-d:#4a3a22;--bg:#efe7d6;}
  *{box-sizing:border-box;}
  body{margin:0;font-family:'Microsoft YaHei','PingFang SC',sans-serif;background:#2b2b30;color:#eee;}
  header{padding:10px 16px;background:#1f1f24;border-bottom:2px solid #3a3a42;display:flex;align-items:center;gap:12px;flex-wrap:wrap;}
  header h1{font-size:16px;margin:0;color:#f3d27a;}
  .hint{font-size:12px;color:#9a9aa5;}
  .palette{display:flex;gap:6px;flex-wrap:wrap;padding:10px 16px;background:#26262c;border-bottom:1px solid #3a3a42;}
  .tool{cursor:pointer;border:2px solid #555;border-radius:8px;padding:6px 10px;font-size:13px;color:#eee;display:flex;align-items:center;gap:6px;background:#33333b;}
  .tool .sw{width:16px;height:16px;border-radius:4px;border:1px solid rgba(0,0,0,.4);}
  .tool.active{border-color:#f3d27a;background:#3d3a2a;box-shadow:0 0 0 2px rgba(243,210,122,.3);}
  .bar{display:flex;gap:8px;align-items:center;padding:8px 16px;background:#26262c;border-bottom:1px solid #3a3a42;flex-wrap:wrap;}
  button.btn{cursor:pointer;background:#6b4f2a;color:#fff;border:none;border-radius:6px;padding:6px 12px;font-size:13px;}
  button.btn:hover{background:#7d5d33;}
  button.btn.ghost{background:#3a3a42;}
  .status{font-size:12px;color:#b8b8c2;}
  .toast{margin-left:auto;font-size:12px;color:#7fe07f;opacity:0;transition:opacity .3s;}
  .toast.show{opacity:1;}
  .wrap{overflow:auto;padding:16px;display:flex;justify-content:center;}
  #cv{border:2px solid #555;border-radius:4px;background:#4a9a40;cursor:crosshair;image-rendering:pixelated;}
  .legend{font-size:11px;color:#9a9aa5;padding:0 16px 16px;}
</style>
</head>
<body>
<header>
  <h1>🌾 Lixin 贴图编辑器</h1>
  <span class="hint">选地形 → 在网格上<b>按住拖拽</b>连续涂格 / 单击单格 · 黄框=已覆盖 · 松开自动保存</span>
</header>
<div class="palette" id="palette"></div>
<div class="bar">
  <button class="btn" id="reloadBtn">↻ 重新加载</button>
  <button class="btn ghost" id="clearBtn">🗑 清空全部覆盖</button>
  <span class="status" id="status">就绪</span>
  <span class="toast" id="toast"></span>
</div>
<div class="wrap"><canvas id="cv"></canvas></div>
<div class="legend">底图：蓝=水面 / 灰=建筑 / 深线=围墙 / 棕/黑/青=道路类型。覆盖格用黄框标出，可随时用「橡皮擦」还原为底图原地形。</div>

<script>
const SCALE=4;
const TOOLS=[
  {t:'grass',  name:'草地',   sw:'#4a9a40'},
  {t:'road',   name:'柏油路', sw:'#2c3036'},
  {t:'concrete',name:'灰水泥路',sw:'#9899a0'},
  {t:'cobble', name:'鹅卵石路',sw:'#8d8a82'},
  {t:'dirt',   name:'土路',   sw:'#9d8b6f'},
  {t:'water',  name:'水面',   sw:'#3f86c4'},
  {t:'erase',  name:'橡皮擦', sw:'#cccccc'}
];
let tool='grass';
let base=null;          // 底图数据
let overrides={};       // "x,y": {t}
let cols=176, rows=132;
let hover=null;

const cv=document.getElementById('cv');
const ctx=cv.getContext('2d');
const palette=document.getElementById('palette');
const statusEl=document.getElementById('status');
const toastEl=document.getElementById('toast');

// 调色板
TOOLS.forEach(tl=>{
  const d=document.createElement('div');
  d.className='tool'+(tl.t===tool?' active':'');
  d.dataset.t=tl.t;
  d.innerHTML='<span class="sw" style="background:'+tl.sw+'"></span>'+tl.name;
  d.onclick=()=>{ tool=tl.t; [...palette.children].forEach(c=>c.classList.toggle('active',c.dataset.t===tool)); statusEl.textContent='已选：'+tl.name; };
  palette.appendChild(d);
});

const TCOLOR={grass:'#4a9a40',road:'#2c3036',concrete:'#9899a0',cobble:'#8d8a82',dirt:'#9d8b6f',water:'#3f86c4'};
function baseColorAt(x,y){
  // 水面
  for(const l of (base.lake||[])) if(x>=l.x&&x<l.x+l.w&&y>=l.y&&y<l.y+l.h) return '#3f86c4';
  for(const p of (base.ponds||[])) if(x>=p.x&&x<p.x+p.w&&y>=p.y&&y<p.y+p.h) return '#3f86c4';
  // 道路
  for(const p of (base.paths||[])) if(x>=p.x&&x<p.x+p.w&&y>=p.y&&y<p.y+p.h)
    return p.type==='road'?'#2c3036':(p.type==='cobble'?'#8d8a82':(p.type==='concrete'?'#9899a0':'#9d8b6f'));
  // 建筑
  for(const b of (base.buildings||[])) if(x>=b.x&&x<b.x+b.w&&y>=b.y&&y<b.y+b.h) return '#8a8a92';
  // 围墙
  for(const w of (base.walls||[])) if(x>=w.x&&x<w.x+w.w&&y>=w.y&&y<w.y+w.h) return '#5a4a3a';
  return '#4a9a40'; // 默认草地
}
function inRect(x,y,r){return x>=r.x&&x<r.x+r.w&&y>=r.y&&y<r.y+r.h;}

function draw(){
  ctx.clearRect(0,0,cv.width,cv.height);
  for(let y=0;y<rows;y++)for(let x=0;x<cols;x++){
    const k=x+','+y;
    let col;
    if(overrides[k]) col=TCOLOR[overrides[k].t]||'#4a9a40';
    else col=baseColorAt(x,y);
    ctx.fillStyle=col;
    ctx.fillRect(x*SCALE,y*SCALE,SCALE,SCALE);
  }
  // 覆盖格黄框
  ctx.strokeStyle='rgba(243,210,122,.9)'; ctx.lineWidth=1;
  for(const k in overrides){ const [x,y]=k.split(',').map(Number); ctx.strokeRect(x*SCALE+0.5,y*SCALE+0.5,SCALE-1,SCALE-1); }
  // 网格（淡）
  ctx.strokeStyle='rgba(0,0,0,.06)'; ctx.lineWidth=1;
  for(let x=0;x<=cols;x+=4){ ctx.beginPath(); ctx.moveTo(x*SCALE,0); ctx.lineTo(x*SCALE,rows*SCALE); ctx.stroke(); }
  for(let y=0;y<=rows;y+=4){ ctx.beginPath(); ctx.moveTo(0,y*SCALE); ctx.lineTo(cols*SCALE,y*SCALE); ctx.stroke(); }
  // hover
  if(hover){ ctx.strokeStyle='rgba(255,255,255,.9)'; ctx.lineWidth=2; ctx.strokeRect(hover.x*SCALE+1,hover.y*SCALE+1,SCALE-2,SCALE-2); }
}

function cellFromEvent(e){
  const r=cv.getBoundingClientRect();
  const x=Math.floor((e.clientX-r.left)/r.width*cols);
  const y=Math.floor((e.clientY-r.top)/r.height*rows);
  if(x<0||y<0||x>=cols||y>=rows) return null;
  return {x,y};
}

let painting=false, dirty=[];
function paint(e){
  const c=cellFromEvent(e); if(!c) return;
  const k=c.x+','+c.y;
  if(tool==='erase'){ if(overrides[k]){ delete overrides[k]; dirty.push({x:c.x,y:c.y,erase:true}); } }
  else { if(!overrides[k]||overrides[k].t!==tool){ overrides[k]={t:tool}; dirty.push({x:c.x,y:c.y,t:tool}); } }
  draw();
}
cv.addEventListener('pointerdown',e=>{ painting=true; dirty=[]; cv.setPointerCapture(e.pointerId); paint(e); });
cv.addEventListener('pointermove',e=>{ const c=cellFromEvent(e); hover=c; if(painting) paint(e); else draw(); });
cv.addEventListener('pointerup',e=>{ painting=false; flush(); });
cv.addEventListener('pointerleave',e=>{ hover=null; if(painting){painting=false;flush();} draw(); });

function flush(){
  if(!dirty.length) return;
  const cells=dirty.slice(); dirty=[];
  toast('保存中…');
  fetch('/api/tiles',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({cells})})
    .then(r=>r.json()).then(d=>{ if(d.ok) toast('已保存 '+cells.length+' 格 ✓'); else toast('保存失败'); })
    .catch(()=>toast('保存失败（服务未启动？）'));
}
let toastT=null;
function toast(msg){ toastEl.textContent=msg; toastEl.classList.add('show'); clearTimeout(toastT); toastT=setTimeout(()=>toastEl.classList.remove('show'),1600); }

function loadAll(){
  Promise.all([fetch('/api/map').then(r=>r.json()), fetch('/api/tiles').then(r=>r.json()).catch(()=>({overrides:{}}))])
    .then(([m,t])=>{
      base=m; cols=m.cols||176; rows=m.rows||132;
      cv.width=cols*SCALE; cv.height=rows*SCALE;
      overrides=t.overrides||{};
      draw();
      statusEl.textContent='底图+覆盖加载完成（'+Object.keys(overrides).length+' 格已覆盖）';
    }).catch(()=>{ statusEl.textContent='加载失败：请确认后端已启动 (node server.js)'; });
}
document.getElementById('reloadBtn').onclick=()=>loadAll();
document.getElementById('clearBtn').onclick=()=>{
  if(!confirm('确定清空全部贴图覆盖？')) return;
  overrides={};
  fetch('/api/tiles',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({cells:[]})})
    .then(()=>{ draw(); toast('已清空 ✓'); });
};
loadAll();
</script>
</body>
</html>
